#235cc4}.tag.gray{background:#eff2f6;color:#6c788b}.muted{color:var(--muted)}.hint{font-size:11px;color:#6e8095}.banner{border:1px solid #e5d5a9;background:#fff8e9;color:#845d14;border-radius:8px;padding:11px 13px;margin:12px 0}.banner.good{border-color:#b6e8d0;background:#ebf9f1;color:#0c7752}.banner.error{border-color:#f2b8c1;background:#fff1f2;color:#aa3244}

.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar .field{min-width:150px}.toolbar .field.search-field{flex:2;min-width:220px}.section-line{border:0;border-top:1px solid #e4e9f1;margin:17px 0}.batch-top{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.sidepanel{border:1px solid #dbe5f4;background:#f5f8ff;border-radius:10px;padding:17px}.sidepanel h3{margin:0 0 10px;font-size:15px}.sidepanel p{font-size:12px;color:#536783}.callout{padding:10px 12px;border-radius:8px;background:#e9f8f0;color:#13734f;font-weight:650;font-size:12px}.counter{display:inline-block;min-width:28px;text-align:center;font-weight:800}.mini{border:1px solid #ccd7e6;background:white;border-radius:6px;padding:4px 8px;font-weight:750;color:#2751a3}.link{border:0;background:none;color:#225ad3;font-weight:750;padding:4px}.work-actions{position:sticky;bottom:0;z-index:2;background:#fff;border:1px solid #d9e2ef;border-radius:10px;box-shadow:0 -4px 20px #162b4a12;padding:12px;margin-top:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.work-actions .field{flex:0 1 250px}.work-actions .push{margin-left:auto}.info{display:flex;align-items:center;gap:9px;font-size:12px;color:#566d86}.info strong{color:#173b74}.empty{padding:45px 20px;text-align:center;color:#75859a}.modalbg{position:fixed;inset:0;background:#12213cc4;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(630px,100%);background:white;border-radius:14px;padding:23px;box-shadow:0 20px 65px #0005}.modal h2{margin:0 0 8px;font-size:20px}.modal p{color:#62758d;margin:0 0 13px}.modal .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.modal .preview{background:#f6f8fb;border-radius:9px;padding:12px;margin:12px 0;max-height:210px;overflow:auto}.foot{font-size:11px;color:#8898aa;margin-top:14px;text-align:center}

</style></head><body><div id="app"></div><script>
(function(){"use strict";
var racks=[{id:"A-02-03",name:"A · секция 02 · полка 03"},{id:"B-01-02",name:"B · секция 01 · полка 02"},{id:"C-01-04",name:"C · секция 01 · полка 04"},{id:"D-03-01",name:"D · секция 03 · полка 01"}];
var fabrics=["Лён натуральный","Блэкаут графит","Велюр песочный","Сатин белый","Рогожка серый меланж","Шенилл оливковый","Хлопок экрю","Жаккард синий","Тюль молочный","Габардин бежевый","Микровелюр капучино","Твид коричневый","Букле кремовый","Муслин серый","Оксфорд тёмно-синий"];
var products=[];for(var i=1;i<=150;i++)products.push({id:"P"+i,article:"ART-"+String(i).padStart(4,"0"),barcode:"460000"+String(i).padStart(7,"0"),name:fabrics[(i-1)%fabrics.length]+" / "+String(i).padStart(3,"0"),stock:i%4===0?0:(i*7)%42+1});
var samples=[];for(var j=1;j<=80;j++){var loc=j<=50?(j%2?"A-02-03":"C-01-04"):j<=70?"B-01-02":"D-03-01";var observed=j<=50?"B-01-02":j<=62?"B-01-02":j<=70?null:"C-01-04";samples.push({id:"S-"+String(j).padStart(6,"0"),p:"P"+j,loc:loc,observed:observed,missing:j>62&&j<=70,deleted:false,version:1,epc:"E2801170"+String(j).padStart(8,"0")})}
var events=[{time:"Сегодня 10:21",kind:"Проверка",text:"Полка B-01-02 · обнаружены 50 чужих образцов"},{time:"Сегодня 10:10",kind:"Наблюдение",text:"Обнаружены EPC; местонахождение не изменено"}];
var st={screen:"work",rack:"B-01-02",target:"B-01-02",source:"observed",status:"wrong",stock:"all",query:"",selection:[],queue:[],scan:"",flash:"",flashType:"good",modal:null,serial:300,created:[],inspectScan:""};
var app=document.getElementById("app");
function e(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function product(id){return products.find(function(x){return x.id===id})}
function place(id){var x=racks.find(function(x){return x.id===id});return x?x.name:id}
function opt(items,value){return items.map(function(x){return '<option value="'+e(x.id)+'" '+(x.id===value?"selected":"")+'>'+e(x.name)+'</option>'}).join("")}
function b(txt,action,style,disabled,extra){return '<button class="btn '+(style||"white")+'" data-action="'+action+'" '+(disabled?"disabled":"")+' '+(extra||"")+'>'+txt+'</button>'}
function h(title,subtitle){return '<header class="header"><div><div class="eyebrow">ОБРАЗЦЫ ТКАНЕЙ / МАССОВАЯ РАБОТА</div><h1>'+title+'</h1><p>'+subtitle+'</p></div><div class="right"><span class="pill"><span class="dot"></span>Сервер · демо</span><span class="pill">Оператор</span></div></header>'}
function notice(){return st.flash?'<div class="banner '+(st.flashType||"")+'">'+e(st.flash)+'</div>':""}
function countSelected(){return st.selection.filter(function(id){return samples.some(function(s){return s.id===id&&!s.deleted})}).length}
function shell(content){var nav=[["work","▤","Рабочий список"],["batch","▦","Создать партией"],["inspect","◫","Проверка полки"],["history","◷","История"]];app.innerHTML='<div class="layout"><aside><div class="brand">▤ Образцы<small>Учёт тканей · v2</small></div>'+nav.map(function(n){return '<button class="nav '+(st.screen===n[0]?"active":"")+'" data-nav="'+n[0]+'"><span class="ico">'+n[1]+'</span><span class="navtext">'+n[2]+'</span></button>'}).join("")+'<div class="side-note"><b>ИНТЕРАКТИВНЫЙ МАКЕТ v2</b><p>Данные демонстрационные. 1С, SQL и C5 не подключены.</p></div></aside><main><div class="demo">ПРОТОТИП ДЛЯ СОГЛАСОВАНИЯ · Массовое создание и массовые исправления · Данные не сохраняются после обновления страницы</div>'+content+'<div class="foot">Дизайн для проверки рабочих сценариев перед реализацией в Windows · 2026</div></main></div>'+(st.modal?modal():"");wire()}
function badge(s){if(s.observed&&s.observed!==s.loc)return '<span class="tag red">ЧУЖОЙ / НЕ НА МЕСТЕ</span>';if(s.observed===s.loc)return '<span class="tag green">НА МЕСТЕ</span>';if(s.missing)return '<span class="tag amber">НЕ НАЙДЕН</span>';return '<span class="tag gray">НЕ ПРОВЕРЯЛСЯ</span>'}
function visible(){return samples.filter(function(s){if(s.deleted)return false;var p=product(s.p);if(st.source==="observed"&&s.observed!==st.rack)return false;if(st.source==="accounted"&&s.loc!==st.rack)return false;if(st.source==="all"&&s.loc!==st.rack&&s.observed!==st.rack)return false;if(st.status==="wrong"&&!(s.observed&&s.observed!==s.loc))return false;if(st.status==="missing"&&!s.missing)return false;if(st.status==="ok"&&s.observed!==s.loc)return false;if(st.stock==="zero"&&p.stock!==0)return false;if(st.query&&[s.id,p.article,p.name,s.epc,s.loc,s.observed||""].join(" ").toLowerCase().indexOf(st.query.toLowerCase())<0)return false;return true})}
function work(){var rows=visible(),selected=countSelected();var wrong=rows.filter(function(s){return s.observed&&s.observed!==s.loc}).length,missing=rows.filter(function(s){return s.missing}).length,zero=rows.filter(function(s){return product(s.p).stock===0}).length;
var body=h("Рабочий список образцов","50–100 строк на одном экране. Фильтрация по полке, фактическому обнаружению и остаткам 1С.")+'<section class="panel"><div class="toolbar"><div class="field narrow"><label class="label">Рабочая полка</label><select id="work-rack" class="input">'+opt(racks,st.rack)+'</select></div><div class="field"><label class="label">Какие образцы показывать</label><select id="source" class="input"><option value="observed" '+(st.source==="observed"?"selected":"")+'>Обнаруженные на этой полке</option><option value="accounted" '+(st.source==="accounted"?"selected":"")+'>Числящиеся на этой полке</option><option value="all" '+(st.source==="all"?"selected":"")+'>Все связанные с полкой</option></select></div><div class="field"><label class="label">Статус</label><select id="status" class="input"><option value="wrong" '+(st.status==="wrong"?"selected":"")+'>Не на своём месте</option><option value="all" '+(st.status==="all"?"selected":"")+'>Все статусы</option><option value="missing" '+(st.status==="missing"?"selected":"")+'>Не найдены</option><option value="ok" '+(st.status==="ok"?"selected":"")+'>На месте</option></select></div><div class="field"><label class="label">Остаток в 1С</label><select id="stock" class="input"><option value="all">Любой остаток</option><option value="zero" '+(st.stock==="zero"?"selected":"")+'>Нулевой остаток</option></select></div><div class="field search-field"><label class="label">Поиск в таблице</label><input id="query" class="input" placeholder="Код, артикул, ткань, EPC" value="'+e(st.query)+'"></div></div><div class="stats"><div class="stat"><b>'+rows.length+'</b><small>В списке</small></div><div class="stat"><b>'+wrong+'</b><small>Не на месте</small></div><div class="stat"><b>'+missing+'</b><small>Не найдены</small></div><div class="stat"><b>'+zero+'</b><small>Остаток 1С = 0</small></div><div class="stat"><b>'+selected+'</b><small>Выбрано</small></div></div><div class="row spread"><div class="info"><strong>Полка '+e(st.rack)+'</strong><span>· '+e(place(st.rack))+'</span></div><div class="row">'+b("Показать 50 чужих","example-50","white")+b("Сбросить фильтры","reset-filters","white")+'</div></div>'+notice()+'<div class="table-scroll"><table class="table"><thead><tr><th><input id="check-all" type="checkbox" '+(rows.length&&rows.every(function(s){return st.selection.indexOf(s.id)>=0})?"checked":"")+'></th><th>Код образца</th><th>Ткань / артикул</th><th>Учётная полка</th><th>Обнаружен</th><th>Статус</th><th>Остаток 1С*</th><th>Действие</th></tr></thead><tbody>'+ (rows.length?rows.map(function(s){var p=product(s.p);return '<tr class="'+(st.selection.indexOf(s.id)>=0?"selected":"")+'"><td><input type="checkbox" data-check="'+e(s.id)+'" '+(st.selection.indexOf(s.id)>=0?"checked":"")+'></td><td><b>'+e(s.id)+'</b></td><td><span class="name">'+e(p.name)+'</span><small>'+e(p.article)+'</small></td><td>'+e(s.loc)+'</td><td>'+e(s.observed|| (s.missing?"Не найден":"Нет данных"))+'</td><td>'+badge(s)+'</td><td class="center"><span class="tag '+(p.stock===0?"amber":"gray")+'">'+p.stock+'</span></td><td><button class="mini" data-row="'+e(s.id)+'">Открыть</button></td></tr>'}).join(""):'<tr><td colspan="8"><div class="empty">Нет строк по выбранным фильтрам</div></td></tr>')+'</tbody></table></div><div class="hint" style="margin-top:9px">* Остаток 1С показан для справки; ноль не означает, что физический образец нужно удалять. В макете данные демонстрационные.</div><div class="work-actions"><div class="info"><strong>'+selected+' выбрано</strong><span>из '+rows.length+' показанных</span></div><div class="field"><label class="label">Целевая полка (отдельно от рабочей)</label><select class="input" id="target">'+opt(racks,st.target)+'</select></div>'+b("Переместить на целевую","move-target","blue",!selected)+b("По факту обнаружения","move-observed","white",!selected)+b("Удалить выбранные","delete-selected","red",!selected)+'</div></section>';
shell(body)}
function queueTotal(){return st.queue.reduce(function(n,x){return n+x.qty},0)}
function batch(){var count=queueTotal(),bad=st.queue.filter(function(x){return !x.p}).length;var body=h("Создание образцов партией","Выберите полку один раз → сканируйте 100 товаров подряд → проверьте список → создайте все.")+'<div class="batch-top"><section class="panel"><div class="toolbar"><div class="field wide"><label class="label">Полка для ВСЕХ создаваемых образцов</label><select class="input" id="batch-rack">'+opt(racks,st.rack)+'</select></div><div class="field wide"><label class="label">Сканирование товаров (Enter)</label><input class="input scan" id="batch-scan" placeholder="Товарный штрихкод / артикул / RACK:..." value="'+e(st.scan)+'" autocomplete="off"></div></div><div class="row" style="margin-top:11px">'+b("Добавить скан","scan-add","blue")+b("Загрузить пример: 100 товаров","demo-100","white")+b("Очистить список","clear-queue","white",!count)+'</div>'+notice()+'<div class="stats"><div class="stat"><b>'+count+'</b><small>Образцов к созданию</small></div><div class="stat"><b>'+st.queue.length+'</b><small>Разных кодов / строк</small></div><div class="stat"><b>'+bad+'</b><small>Не распознано</small></div><div class="stat"><b>'+e(st.rack)+'</b><small>Место всей партии</small></div></div><div class="row spread"><div><h2>Очередь сканирования</h2><div class="sub">Каждое сканирование = один образец. Повтор того же товара увеличивает количество и помечается.</div></div><span class="tag blue">НЕ СОХРАНЕНО</span></div><div class="table-scroll" style="max-height:470px"><table class="table" style="min-width:730px"><thead><tr><th>№</th><th>Товар</th><th>Артикул / ШК</th><th>Кол-во образцов</th><th>Проверка</th><th>Убрать</th></tr></thead><tbody>'+(st.queue.length?st.queue.map(function(x,i){var p=product(x.p);return '<tr><td>'+(i+1)+'</td><td><b>'+e(p?p.name:"Код не найден")+'</b></td><td>'+e(p?p.article:x.code)+'</td><td><button class="mini" data-dec="'+i+'">−</button><span class="counter">'+x.qty+'</span><button class="mini" data-inc="'+i+'">+</button></td><td>'+(p?(x.qty>1?'<span class="tag amber">ПОВТОР '+x.qty+'×</span>':'<span class="tag green">ГОТОВО</span>'):'<span class="tag red">НЕИЗВЕСТЕН</span>')+'</td><td><button class="mini" data-remove="'+i+'">×</button></td></tr>'}).join(""):'<tr><td colspan="6"><div class="empty">Список пуст. Выберите полку и сканируйте товарные штрихкоды подряд.</div></td></tr>')+'</tbody></table></div><div class="work-actions"><span class="info">Партия: <strong>'+count+' физических образцов</strong> → '+e(st.rack)+'</span><span class="push"></span>'+b("Создать "+count+" образцов на полке "+e(st.rack),"commit-batch","green",!count||bad>0)+'</div></section><aside class="sidepanel" style="display:block;background:#f4f8ff;color:#18385e;padding:18px"><h3>Как работать со 100 товарами</h3><p><b>1.</b> Сканируйте код полки или выберите её вверху.</p><p><b>2.</b> Сканируйте 100 товарных ШК подряд, без подтверждения каждой строки.</p><p><b>3.</b> Повторное сканирование того же товара увеличит количество; это видно до сохранения.</p><p><b>4.</b> Неизвестные коды выделятся красным. Пока они есть, сохранить партию нельзя.</p><p><b>5.</b> Нажмите одну кнопку «Создать N образцов». Все получат уникальные коды и одну полку.</p><div class="callout">1 сканирование = 1 физический образец</div><p style="margin-top:14px">Никаких изменений остатков 1С. Если партия ошибочная, исправьте её ДО сохранения.</p><p class="hint">В реальной версии требуется атомарное пакетное сохранение, идемпотентность и отчёт по созданным кодам.</p></aside></div>';
shell(body);var input=document.getElementById("batch-scan");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}
function inspect(){var related=samples.filter(function(s){return !s.deleted&&(s.loc===st.rack||s.observed===st.rack)});var wrong=related.filter(function(s){return s.observed===st.rack&&s.loc!==st.rack}).length,missing=related.filter(function(s){return s.loc===st.rack&&s.missing}).length;
shell(h("Проверка полки","Наблюдение отдельно от учётного перемещения. Проблемные образцы передаются в рабочий список.")+'<div class="panel"><div class="toolbar"><div class="field narrow"><label class="label">Проверяемая полка</label><select id="inspect-rack" class="input">'+opt(racks,st.rack)+'</select></div><div class="field wide"><label class="label">Сканировать код образца / EPC</label><input id="inspect-scan" class="input scan" placeholder="S-000001 или EPC..." value="'+e(st.inspectScan)+'"></div>'+b("Зафиксировать наблюдение","inspect-observe","blue")+'</div><div class="stats"><div class="stat"><b>'+related.length+'</b><small>Связаны с полкой</small></div><div class="stat"><b>'+wrong+'</b><small>Обнаружены чужие</small></div><div class="stat"><b>'+missing+'</b><small>Не найдены</small></div></div>'+notice()+'<div class="banner">Сканирование само по себе не меняет учётное место и не удаляет образцы. Статусы в демо подготовлены заранее; в реальном приложении они формируются из замороженного снимка проверки.</div><div class="row">'+b("Открыть 50 чужих в рабочем списке","open-wrong","blue")+b("Показать не найденные","open-missing","white")+'</div></div>')}
function history(){shell(h("История действий","В реальном приложении журнал неизменяем и сохраняется в базе.")+'<div class="panel"><div class="table-scroll"><table class="table" style="min-width:600px"><thead><tr><th>Когда</th><th>Тип</th><th>Описание</th></tr></thead><tbody>'+events.map(function(x){return '<tr><td>'+e(x.time)+'</td><td><span class="tag blue">'+e(x.kind)+'</span></td><td>'+e(x.text)+'</td></tr>'}).join("")+'</tbody></table></div></div>')}
function modal(){var m=st.modal;if(!m)return "";var title=m.type==="move"?"Массовое перемещение":m.type==="delete"?"Массовое удаление":"Подтверждение";var ids=m.ids||[];var preview=ids.slice(0,9).map(function(id){var s=samples.find(function(x){return x.id===id});return s?'<div>'+e(s.id)+' · '+e(s.loc)+' → '+e(m.type==="delete"?"УДАЛЕНИЕ":m.mode==="observed"?s.observed:m.target)+'</div>':""}).join("");return '<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><span class="tag '+(m.type==="delete"?"red":"blue")+'">'+(m.type==="delete"?"НЕОБРАТИМО":"ПРЕДПРОСМОТР ОПЕРАЦИИ")+'</span><h2>'+title+' · '+ids.length+' образцов</h2><p>'+(m.type==="delete"?"Образцы будут окончательно исключены из активного учёта. Техническая история останется. Нулевой остаток 1С не является причиной автоматического удаления.":"Каждое изменение места будет записано как отдельное событие. Повторно сканировать образцы не нужно.")+'</p><div class="preview">'+preview+(ids.length>9?'<div class="muted">…и ещё '+(ids.length-9)+' образцов</div>':"")+'</div><p class="hint">Демо выполняет действие только в памяти страницы. В реальной программе сервер проверит версии всех строк до сохранения.</p><div class="actions">'+b("Отмена","cancel-modal","white")+b(m.type==="delete"?"Подтвердить удаление "+ids.length:"Переместить "+ids.length,"confirm-modal",m.type==="delete"?"redfill":"blue")+'</div></div></div>'}
function render(){if(st.screen==="work")work();else if(st.screen==="batch")batch();else if(st.screen==="inspect")inspect();else history()}
function flash(msg,type){st.flash=msg;st.flashType=type||"good"}
function addScan(code){code=String(code||"").trim();if(!code){flash("Введите или отсканируйте код товара.","error");render();return}
if(code.toUpperCase().startsWith("RACK:")){var r=code.slice(5).toUpperCase();if(racks.some(function(x){return x.id===r})){st.rack=r;flash("Выбрана полка "+r+". Все строки партии будут размещены на ней.","good")}else flash("Полка "+r+" не найдена.","error");st.scan="";render();return}
var p=products.find(function(x){return x.barcode===code||x.article.toUpperCase()===code.toUpperCase()});var item=st.queue.find(function(x){return x.code===code});if(item)item.qty++;else st.queue.push({code:code,p:p?p.id:null,qty:1});st.scan="";flash(p?"Добавлен "+p.article+" · сканирований: "+queueTotal():"Неизвестный код "+code+". Исправьте или удалите строку.",""+(p?"good":"error"));render()}
function moveModal(ids,mode){ids=ids.filter(function(id){var s=samples.find(function(x){return x.id===id});return s&&!s.deleted&&(mode!=="observed"||!!s.observed)});if(!ids.length){flash("Нет подходящих образцов. Для перемещения по факту нужно зафиксированное наблюдение.","error");render();return}st.modal={type:"move",ids:ids,mode:mode,target:st.target};render()}
function deleteModal(ids){ids=ids.filter(function(id){return samples.some(function(s){return s.id===id&&!s.deleted})});if(!ids.length)return;st.modal={type:"delete",ids:ids};render()}
function wire(){document.querySelectorAll("[data-nav]").forEach(function(x){x.onclick=function(){st.screen=this.getAttribute("data-nav");st.flash="";st.selection=[];render()}});
function change(id,cb){var x=document.getElementById(id);if(x)x.onchange=function(){cb(this.value);render()}}
change("work-rack",function(v){st.rack=v;st.selection=[]});change("batch-rack",function(v){st.rack=v;flash("Вся партия будет создана на полке "+v+".","good")});change("inspect-rack",function(v){st.rack=v});change("source",function(v){st.source=v;st.selection=[]});change("status",function(v){st.status=v;st.selection=[]});change("stock",function(v){st.stock=v;st.selection=[]});change("target",function(v){st.target=v});
var q=document.getElementById("query");if(q){q.onchange=function(){st.query=this.value;st.selection=[];render()};q.onkeydown=function(ev){if(ev.key==="Enter"){st.query=this.value;st.selection=[];render()}}}
var bs=document.getElementById("batch-scan");if(bs){bs.oninput=function(){st.scan=this.value};bs.onkeydown=function(ev){if(ev.key==="Enter"){ev.preventDefault();addScan(this.value)}}}
var is=document.getElementById("inspect-scan");if(is){is.oninput=function(){st.inspectScan=this.value};is.onkeydown=function(ev){if(ev.key==="Enter"){ev.preventDefault();inspectObserve()}}}
var ca=document.getElementById("check-all");if(ca)ca.onchange=function(){var ids=visible().map(function(s){return s.id});st.selection=this.checked?Array.from(new Set(st.selection.concat(ids))):st.selection.filter(function(id){return ids.indexOf(id)<0});render()};
document.querySelectorAll("[data-check]").forEach(function(x){x.onchange=function(){var id=this.getAttribute("data-check");if(this.checked){if(st.selection.indexOf(id)<0)st.selection.push(id)}else st.selection=st.selection.filter(function(z){return z!==id});render()}});
document.querySelectorAll("[data-row]").forEach(function(x){x.onclick=function(){var id=this.getAttribute("data-row");st.selection=[id];flash("Выбран "+id+". Используйте массовые действия внизу таблицы.","good");render()}});
document.querySelectorAll("[data-dec]").forEach(function(x){x.onclick=function(){var i=Number(this.getAttribute("data-dec"));st.queue[i].qty--;if(st.queue[i].qty<=0)st.queue.splice(i,1);render()}});
document.querySelectorAll("[data-inc]").forEach(function(x){x.onclick=function(){st.queue[Number(this.getAttribute("data-inc"))].qty++;render()}});
document.querySelectorAll("[data-remove]").forEach(function(x){x.onclick=function(){st.queue.splice(Number(this.getAttribute("data-remove")),1);render()}});
document.querySelectorAll("[data-action]").forEach(function(x){x.onclick=function(){var a=this.getAttribute("data-action");
if(a==="demo-100"){st.queue=products.slice(0,100).map(function(p){return {code:p.barcode,p:p.id,qty:1}});flash("100 товаров загружены. Проверьте список и создайте партию.","good");render()}
else if(a==="scan-add"){addScan(document.getElementById("batch-scan").value)}
else if(a==="clear-queue"){st.queue=[];flash("Очередь очищена. В базе ничего не изменено.","good");render()}
else if(a==="commit-batch"){var total=queueTotal(),bad=st.queue.filter(function(x){return !x.p}).length;if(!total||bad)return;st.created=[];st.queue.forEach(function(x){for(var n=0;n<x.qty;n++){var id="S-"+String(st.serial++).padStart(6,"0");samples.push({id:id,p:x.p,loc:st.rack,observed:null,missing:false,deleted:false,version:1,epc:""});st.created.push(id)}});events.unshift({time:"Только что",kind:"Создание",text:st.created.length+" образцов создано партией на "+st.rack});st.queue=[];st.source="accounted";st.status="all";st.stock="all";st.query="";st.screen="work";st.selection=[];flash("Создано "+total+" образцов на полке "+st.rack+". Все получили уникальные коды (только демо).","good");render()}
else if(a==="example-50"){st.rack="B-01-02";st.target="B-01-02";st.source="observed";st.status="wrong";st.stock="all";st.query="";st.selection=[];flash("Показаны 50 образцов, обнаруженных на B-01-02, но числящихся на других полках.","good");render()}
else if(a==="reset-filters"){st.source="observed";st.status="all";st.stock="all";st.query="";st.selection=[];st.flash="";render()}
else if(a==="move-target"){moveModal(st.selection,"target")}
else if(a==="move-observed"){moveModal(st.selection,"observed")}
else if(a==="delete-selected"){deleteModal(st.selection)}
else if(a==="cancel-modal"){st.modal=null;render()}
else if(a==="confirm-modal"){var m=st.modal;if(!m)return;var n=0;m.ids.forEach(function(id){var s=samples.find(function(x){return x.id===id});if(!s||s.deleted)return;if(m.type==="delete"){s.deleted=true;s.version++;n++}else{var to=m.mode==="observed"?s.observed:m.target;if(to&&to!==s.loc){s.loc=to;s.version++;n++}}});events.unshift({time:"Только что",kind:m.type==="delete"?"Удаление":"Перемещение",text:n+" образцов · массовая операция"});st.modal=null;st.selection=[];flash((m.type==="delete"?"Удалено из активного учёта ":"Перемещено ")+n+" образцов. История сохранена. (Демо)","good");render()}
else if(a==="inspect-observe"){inspectObserve()}
else if(a==="open-wrong"){st.screen="work";st.source="observed";st.status="wrong";st.stock="all";st.selection=[];st.flash="";render()}
else if(a==="open-missing"){st.screen="work";st.source="accounted";st.status="missing";st.stock="all";st.selection=[];st.flash="";render()}
}})}
function inspectObserve(){var code=st.inspectScan.trim();var s=samples.find(function(x){return !x.deleted&&(x.id.toLowerCase()===code.toLowerCase()||x.epc.toLowerCase()===code.toLowerCase())});if(!s){flash("Код не распознан. В реальной проверке неизвестный EPC должен сохраниться как наблюдение.","error")}else{s.observed=st.rack;s.missing=false;flash("Наблюдение "+s.id+" на "+st.rack+" записано. Учётная полка "+s.loc+" НЕ изменена.","good")}st.inspectScan="";render()}
render()})();
</script></body></html>
