<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Образцы тканей — интерактивный макет v6</title>
<style>
:root{--bg:#f3f6fb;--white:#fff;--ink:#122742;--muted:#61758e;--line:#d9e3f0;--blue:#215ae7;--blue-light:#e9f0ff;--green:#087e57;--green-light:#e7f7ef;--red:#b72c40;--red-light:#fff0f2;--amber:#9b6107;--amber-light:#fff5df;--shadow:0 5px 24px #172b470b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8db3ff;outline-offset:2px}
.wrap{max-width:1320px;margin:auto;padding:18px 22px 64px}.demo{background:var(--blue-light);border:1px solid #c6d7ff;border-radius:10px;color:#294b84;padding:10px 15px;font-size:13px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.logo{font-weight:900;font-size:21px;letter-spacing:-.03em}.logo small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.nav button{min-height:42px;border:1px solid var(--line);background:#fff;color:#31506f;border-radius:9px;padding:9px 14px;font-weight:750}.nav button.active{background:#dce9ff;border-color:#9bbdff;color:#184ab0}
.shelf{background:#102b4c;color:white;border-radius:14px;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.shelf small{color:#bcd5fa;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.shelf strong{font-size:34px;display:block;line-height:1.25}.shelf span{font-size:13px;color:#d1e1f7}
h1{font-size:28px;letter-spacing:-.035em;margin:0 0 7px;line-height:1.2}h2{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 10px}.sub{color:var(--muted);margin-bottom:17px}.eyebrow{font-size:12px;color:#637b96;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #b5c9e3;border-radius:10px;background:white;color:#23456c;min-height:44px;padding:10px 16px;font-weight:750;text-align:center;white-space:normal}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--green);border-color:var(--green);color:white}.btn.red{background:var(--red);border-color:var(--red);color:white}.btn.ghost{background:#f6f9ff}.btn.small{min-height:36px;padding:6px 10px;font-size:13px}.btn.big{min-height:54px;font-size:16px;padding:12px 20px}
.task{display:flex;align-items:flex-start;gap:14px;text-align:left;min-height:117px;border:2px solid var(--line);background:white;border-radius:13px;padding:20px;width:100%}.task:hover{border-color:#86a8e9}.sym{display:grid;place-items:center;min-width:45px;height:45px;background:var(--blue-light);border-radius:11px;color:var(--blue);font-size:24px;font-weight:900}.task strong{display:block;font-size:19px;margin-bottom:5px}.task small{color:var(--muted);font-size:14px}
.stat{border:1px solid var(--line);background:#f7f9fd;border-radius:12px;padding:15px}.stat b{display:block;font-size:29px;line-height:1.15}.stat small{font-size:13px;color:var(--muted)}.stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}.stat.green b{color:var(--green)}
.kpi{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-height:122px}.kpi:hover{border-color:#86a8e9}.kpi b{display:block;font-size:32px}.kpi strong{display:block}.kpi small{color:var(--muted)}
.notice{border:1px solid #c9d9ff;background:#eaf1ff;color:#284e91;padding:12px 15px;border-radius:9px}.notice.good{background:var(--green-light);border-color:#b6dfc9;color:#08603f}.notice.warn{background:var(--amber-light);border-color:#f1d5a0;color:#85540b}.notice.error{background:var(--red-light);border-color:#f0bac4;color:#a1273b}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-weight:750;font-size:13px;color:#4e6682}.input{border:1px solid #b1c3d9;border-radius:9px;padding:10px 12px;background:#fff;min-height:45px;width:100%;color:var(--ink)}.input.scan{min-height:59px;font-size:19px;font-weight:650}.field.short{width:260px;max-width:100%}.field.grow{flex:1}
.tablebox{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:430px}.tbl{border-collapse:collapse;width:100%;min-width:720px}.tbl th{text-align:left;background:#eef3fb;position:sticky;top:0;z-index:1;font-size:12px;color:#49617e;padding:11px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 11px;border-bottom:1px solid #e9eff6;font-size:13px;vertical-align:middle}.tbl tr:hover td{background:#f9fbff}.tbl small{color:var(--muted)}.tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}.tbl td:last-child{white-space:normal}
.tag{display:inline-block;border-radius:6px;background:#edf2f8;color:#526a84;font-size:12px;font-weight:800;padding:4px 8px}.tag.red{background:var(--red-light);color:var(--red)}.tag.green{background:var(--green-light);color:var(--green)}.tag.amber{background:var(--amber-light);color:var(--amber)}
.bar{position:sticky;bottom:9px;z-index:5;background:#fff;border:2px solid #c5d7ee;border-radius:12px;padding:12px 14px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 7px 25px #18395d1c}
.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.tabs{display:flex;flex-wrap:wrap;gap:7px}.tabs button{border:1px solid #c2d2e8;background:white;padding:9px 13px;border-radius:9px;font-weight:750;color:#2b4c70;min-height:42px}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.item strong{font-size:15px}.item small{color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.divider{border:0;border-top:1px solid var(--line);margin:4px 0}.check{display:flex;align-items:center;gap:10px}.check input{width:21px;height:21px;accent-color:var(--blue)}
.badge{font-size:12px;border:1px solid #d5e0ef;padding:5px 9px;border-radius:7px;background:#f6f9fd}.backline{margin-bottom:12px}.print-only{display:none}
@media(max-width:950px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.wrap{padding:12px}.grid,.grid3,.grid4{grid-template-columns:1fr}.panel{padding:15px}.task{min-height:95px;padding:15px}.shelf{align-items:flex-start}.shelf strong{font-size:27px}.top{align-items:flex-start}.kpi{min-height:95px}}
@media print{body{background:white}.wrap>*{display:none!important}.print-only{display:block!important}.labelprint{display:grid;grid-template-columns:repeat(3,1fr);gap:10mm}.labelcell{border:1px solid black;padding:6mm;break-inside:avoid}.labelcell b{font-size:16pt}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){"use strict";
var STORAGE="fabric-samples-demo-v6";
var R=[{id:"A-02-03",name:"Стеллаж A · секция 02 · полка 03"},{id:"B-01-02",name:"Стеллаж B · секция 01 · полка 02"},{id:"C-01-04",name:"Стеллаж C · секция 01 · полка 04"},{id:"D-03-01",name:"Стеллаж D · секция 03 · полка 01"}];
var names=["Лён натуральный","Блэкаут графит","Велюр песочный","Сатин белый","Рогожка серый меланж","Шенилл оливковый","Хлопок экрю","Жаккард синий","Тюль молочный","Габардин бежевый","Микровелюр капучино","Твид коричневый","Букле кремовый","Муслин серый","Оксфорд тёмно-синий"];
function now(){return new Date().toISOString()}
function uid(){return "req-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function seed(){
var products=Array.from({length:140},function(_,i){var n=i+1;return{id:n,name:names[i%names.length]+" / "+String(n).padStart(3,"0"),article:"ART-"+String(n).padStart(4,"0"),barcode:"460000"+String(n).padStart(7,"0"),stock:n%4===0?0:(n*7)%38+1}});
var samples=Array.from({length:80},function(_,i){var n=i+1;return{id:"S-"+String(n).padStart(6,"0"),productId:n,loc:n<=50?(n%2?"A-02-03":"C-01-04"):n<=70?"B-01-02":"C-01-04",active:true,version:1,labeled:true,epc:"E200DEMO"+String(n).padStart(8,"0"),epcHistory:[{epc:"E200DEMO"+String(n).padStart(8,"0"),from:"2026-10-01T08:00:00Z",to:null}],createdAt:"2026-10-01T08:00:00Z"}});
var expected=samples.filter(function(s){return s.loc==="B-01-02"}).map(function(s){return{id:s.id,loc:s.loc,version:s.version}});
var observations=samples.filter(function(s){var n=Number(s.id.slice(2));return n<=50||(n>=59&&n<=70)}).map(function(s){return{sampleId:s.id,code:s.id,at:"2026-10-29T10:20:00Z",source:"Демо C5",registeredLocAtScan:s.loc}});
var inspection={id:"demo-b",rack:"B-01-02",startedAt:"2026-10-29T10:00:00Z",finishedAt:"2026-10-29T10:21:00Z",status:"finished",expected:expected,observations:observations,unresolved:[],scanLog:[]};
return{schema:6,products:products,samples:samples,inspections:[inspection],resolutions:[],audit:[{id:uid(),kind:"Проверка",at:inspection.finishedAt,detail:"B-01-02: 50 чужих, 8 не найдены, 12 на месте",sampleIds:[],requestId:null}],requests:{},queue:[],nextSample:300,c5Online:true,c5Queue:[],deliveredEvents:{},catalogUpdatedAt:"2026-10-29T09:00:00Z",lastBackup:null,lastCreatedIds:[]};
}
function load(){try{var x=JSON.parse(localStorage.getItem(STORAGE)||"null");if(x&&x.schema===6&&Array.isArray(x.samples)&&Array.isArray(x.inspections)&&Array.isArray(x.products))return x}catch(e){}return seed()}
var db=load();if(!Array.isArray(db.lastCreatedIds))db.lastCreatedIds=[];
var S={page:"warehouse",stack:[],rack:"B-01-02",toast:"",toastType:"good",search:"",findCode:"",focusId:null,reportTab:"no",reportPage:0,reportSearch:"",reportSelected:[],issueType:"wrong",selected:[],target:"",removeFilter:"rack",createCode:"",inspectCode:"",moveCode:"",removeCode:"",labelCode:"",c5Code:"",confirm:null,simulateConflict:false,simulateNetwork:false,noticeDetails:"",newIds:db.lastCreatedIds.slice(),showAll:false,onlyUnchecked:false,afterShelf:null,issueAction:null};
var root=document.getElementById("app");
function E(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db));return true}catch(e){S.toast="Браузер не смог сохранить демонстрационные данные. Экспортируйте резервную копию.";S.toastType="error";return false}}
function product(id){return db.products.find(function(x){return x.id===id})}
function sample(id){return db.samples.find(function(x){return x.id===id})}
function rackName(id){var x=R.find(function(r){return r.id===id});return x?x.name:id}
function active(){return db.samples.filter(function(x){return x.active})}
function productSamples(id){return active().filter(function(x){return x.productId===id})}
function latest(r){return db.inspections.filter(function(x){return x.rack===r&&x.status==="finished"}).sort(function(a,b){return String(b.finishedAt).localeCompare(String(a.finishedAt))})[0]||null}
function running(){return db.inspections.find(function(x){return x.status==="active"})||null}
function key(ins,type,id){return ins.id+":"+type+":"+id}
function resolved(ins,type,id){return db.resolutions.some(function(x){return x.key===key(ins,type,id)})}
function issues(ins,type,openOnly){if(!ins)return[];var found=new Set(ins.observations.map(function(x){return x.sampleId}));
var rows=type==="missing"?ins.expected.filter(function(x){return!found.has(x.id)}).map(function(x){return{sampleId:x.id,type:type,insId:ins.id,rack:ins.rack,from:x.loc,observed:null}}):ins.observations.filter(function(x){return x.registeredLocAtScan!==ins.rack}).map(function(x){return{sampleId:x.sampleId,type:type,insId:ins.id,rack:ins.rack,from:x.registeredLocAtScan,observed:ins.rack}});
return openOnly?rows.filter(function(x){return!resolved(ins,type,x.sampleId)&&sample(x.sampleId)?.active}):rows}
function rackIssues(r,type){return issues(latest(r),type,true)}
function allIssues(type){return R.flatMap(function(r){return rackIssues(r.id,type)})}
function noSample(){return db.products.filter(function(p){return productSamples(p.id).length===0})}
function zeroSamples(){return active().filter(function(s){return product(s.productId)?.stock===0})}
function toast(message,type){S.toast=message;S.toastType=type||"good"}
function go(page){if(S.page!==page)S.stack.push(S.page);S.page=page;S.toast="";render()}
function back(){S.page=S.stack.pop()||"warehouse";S.toast="";render()}
function B(label,action,cls,disabled,extra){return'<button type="button" class="btn '+(cls||"")+'" data-act="'+E(action)+'" '+(disabled?"disabled":"")+' '+(extra||"")+'>'+label+'</button>'}
function tag(t,c){return'<span class="tag '+(c||"")+'">'+E(t)+'</span>'}
function head(title,sub){return'<div class="eyebrow">УЧЁТ ФИЗИЧЕСКИХ ОБРАЗЦОВ</div><h1>'+E(title)+'</h1><p class="sub">'+E(sub)+'</p>'}
function options(selected,empty){return(empty?'<option value="">Выберите полку…</option>':"")+R.map(function(r){return'<option value="'+r.id+'" '+(r.id===selected?"selected":"")+'>'+r.id+' — '+E(r.name)+'</option>'}).join("")}
function field(id,label,placeholder,cls,value){return'<div class="field"><label for="'+id+'">'+label+'</label><input class="input '+(cls||"")+'" id="'+id+'" autocomplete="off" spellcheck="false" placeholder="'+E(placeholder||"")+'" value="'+E(value||"")+'"></div>'}
function stamp(x){if(!x)return"Нет данных";var d=new Date(x);return isNaN(d.valueOf())?x:d.toLocaleString("ru-RU")}
function nav(){var pages=[["warehouse","Склад"],["work","Работа на полке"],["find","Найти образец"],["reports","Отчёты"],["history","Журнал"],["service","Система / C5"]];return'<div class="nav">'+pages.map(function(p){return'<button data-act="nav-'+p[0]+'" class="'+(S.page===p[0]?"active":"")+'">'+p[1]+'</button>'}).join("")+'</div>'}
function frame(body){var isWork=["work","shelf","create","inspection","issues","move","remove","labels","confirm"].includes(S.page);var shelf=isWork?'<div class="shelf"><div><small>Рабочая полка</small><strong>'+E(S.rack)+'</strong><span>'+E(rackName(S.rack))+'</span></div>'+B("Сменить полку","shelf","",!!running()||S.page==="confirm")+'</div>':"";
var n=active().filter(function(x){return!x.labeled}).length;
root.innerHTML='<div class="wrap"><div class="demo"><b>ИНТЕРАКТИВНЫЙ МАКЕТ v6.</b> Данные и остатки вымышленные. Нет подключений к 1С, SQL Server, C5, API или принтеру. Изменения хранятся в localStorage браузера, если он это разрешает. '+(n?'Ожидают маркировки: <b>'+n+'</b>.':"")+'</div><div class="top"><div class="logo">▤ Образцы тканей<small>Склад → полка → сканирование → действие</small></div><span class="badge">Демо · оператор</span></div>'+nav()+(S.page!=="warehouse"&&S.page!=="reports"&&S.page!=="history"&&S.page!=="service"&&S.page!=="find"?'<div class="backline">'+B("← Назад","back","ghost")+' '+B("Обзор склада","nav-warehouse","ghost")+'</div>':"")+shelf+(S.toast?'<div class="notice '+S.toastType+'" role="status" style="margin-bottom:14px">'+E(S.toast)+'</div>':"")+'<main class="stack">'+body+'</main><div class="tiny" style="text-align:center;margin-top:24px">Макет v6 · все действия только с демонстрационными данными</div></div>';bind();var id={create:"create-scan",inspection:"inspection-scan",move:"move-scan",remove:"remove-scan",labels:"label-scan"}[S.page];if(id)document.getElementById(id)?.focus()}
function kpi(n,label,desc,act,cls){return'<button class="kpi" data-act="'+act+'"><b style="color:'+(cls||"#17365a")+'">'+E(n)+'</b><strong>'+E(label)+'</strong><small>'+E(desc)+'</small></button>'}
function rackTable(){return'<div class="tablebox"><table class="tbl"><thead><tr><th>Полка</th><th>Числится</th><th>Последняя проверка</th><th>Чужие</th><th>Не найдены</th><th>Действия</th></tr></thead><tbody>'+R.filter(function(r){return!S.onlyUnchecked||!latest(r.id)}).map(function(r){var ins=latest(r.id),count=active().filter(function(x){return x.loc===r.id}).length;return'<tr><td><b>'+r.id+'</b><br><small>'+E(r.name)+'</small></td><td>'+count+'</td><td>'+(ins?stamp(ins.finishedAt):tag("Не проверялась","amber"))+'</td><td>'+(ins?rackIssues(r.id,"wrong").length:"—")+'</td><td>'+(ins?rackIssues(r.id,"missing").length:"—")+'</td><td>'+B("Работать","rack-"+r.id,"small primary")+' '+B("Проверить","check-"+r.id,"small")+'</td></tr>'}).join("")+'</tbody></table></div>'}
function warehouse(){var wrong=allIssues("wrong").length,missing=allIssues("missing").length,unchecked=R.filter(function(r){return!latest(r.id)}).length;
frame(head("Обзор всего склада","Показатели по всем полкам. Исторические результаты проверок не переписываются после новых операций.")+'<div class="grid4">'+kpi(active().length,"Активных образцов","Физических экземпляров","report-all")+
kpi(wrong,"Чужие на полках","Открытые расхождения","report-wrong","#b72c40")+
kpi(missing,"Не найдены","После завершённых проверок","report-missing","#9b6107")+
kpi(unchecked,"Полки без проверки","Нет завершённого сеанса","unchecked","#9b6107")+'</div>'+
'<section class="panel stack"><div class="row between"><div><h2>'+(S.onlyUnchecked?'Полки без проверки':'Полки и проверки')+'</h2><p class="tiny">В таблице открытые проблемы только последних завершённых проверок каждой полки. «—» означает нет данных.</p></div><div class="row">'+(S.onlyUnchecked?B('Показать все полки','show-all-racks',''):'')+B("Перейти к работе","nav-work","primary")+'</div></div>'+rackTable()+'</section>'+
'<section class="panel stack"><h2>Дополнительная аналитика</h2><div class="grid3">'+kpi(noSample().length,"Товаров без образца","Не обязательно создавать","report-no")+
kpi(zeroSamples().length,"Образцов с остатком 0","Кандидаты для ручного пересмотра","report-zero")+
kpi(db.products.length,"Товаров в каталоге","Последнее демо-обновление: "+stamp(db.catalogUpdatedAt),"report-catalog")+'</div></section>')}
function work(){var ins=latest(S.rack),runningHere=running()&&running().rack===S.rack,unlabeled=active().filter(function(x){return!x.labeled}).length;
frame(head("Работа на полке "+S.rack,"Выберите действие. Сканирование само не изменяет учётное место.")+
'<div class="grid">'+
'<button class="task" data-act="create"><span class="sym">＋</span><span><strong>Добавить образцы</strong><small>Сканируйте товары подряд, затем создайте партию и промаркируйте экземпляры.</small></span></button>'+
'<button class="task" data-act="move"><span class="sym">↔</span><span><strong>Переместить</strong><small>Сканируйте уникальные коды образцов и укажите полку назначения.</small></span></button>'+
'<button class="task" data-act="inspection"><span class="sym">▣</span><span><strong>'+(runningHere?"Продолжить проверку":"Проверить полку")+'</strong><small>Автоматически принимать сканы; завершение — только вручную.</small></span></button>'+

function render(){if(S.page==="warehouse")warehouse();else if(S.page==="work")work();else if(S.page==="shelf")shelfPage();else if(S.page==="create")create();else if(S.page==="inspection")inspection();else if(S.page==="issues")issuesPage();else if(S.page==="move")move();else if(S.page==="remove")remove();else if(S.page==="find")find();else if(S.page==="reports")reports();else if(S.page==="history")history();else if(S.page==="service")service();else if(S.page==="labels")labels();else if(S.page==="confirm")confirmPage()}
function selectId(id,yes){if(yes){if(!S.selected.includes(id))S.selected.push(id)}else S.selected=S.selected.filter(function(x){return x!==id})}
function setShelf(id){id=String(id||"").replace(/^RACK:/i,"").toUpperCase().trim();if(!R.some(function(r){return r.id===id})){toast("Неизвестная полка: "+id,"error");render();return}
if(running()){toast("Сначала завершите или отмените проверку "+running().rack,"warn");render();return}
if(id!==S.rack&&queueCount()&&!window.confirm("В очереди "+queueCount()+" образцов. Переназначить всю ещё не созданную партию на "+id+"?"))return;
S.rack=id;S.selected=[];S.target="";toast("Рабочая полка выбрана: "+id);S.page=S.afterShelf||"work";S.afterShelf=null;render()}
function createScan(code){code=String(code||"").trim();if(!code)return;if(/^RACK:/i.test(code)){toast("Это код полки. Смените её отдельно.","error");render();return}
var p=db.products.find(function(x){return x.barcode===code||x.article.toUpperCase()===code.toUpperCase()});
var q=db.queue.find(function(x){return p?x.productId===p.id:!x.productId&&x.code===code});if(q)q.qty++;else db.queue.push({code:code,productId:p?.id||null,qty:1});
save();toast(p?"Добавлен "+p.article+" · всего "+queueCount():"Код не найден: "+code+". Уберите ошибочную строку.",p?"good":"error");render()}
function startInspection(){var old=running();if(old){if(old.rack!==S.rack){S.rack=old.rack;toast("Продолжите уже начатую проверку "+old.rack,"warn")}render();return}
var ins={id:uid(),rack:S.rack,startedAt:now(),finishedAt:null,status:"active",expected:active().filter(function(x){return x.loc===S.rack}).map(function(x){return{id:x.id,loc:x.loc,version:x.version}}),observations:[],unresolved:[],scanLog:[]};
db.inspections.push(ins);save();toast("Проверка началась. Сканируйте подряд.");render()}
function observation(ins,x,code,source){if(ins.observations.some(function(o){return o.sampleId===x.id})){ins.scanLog.push({code:code,result:"Повтор",at:now()});toast("Повтор "+x.id+" не увеличивает найденных.","warn");return}
var rec={sampleId:x.id,code:code,at:now(),source:source,registeredLocAtScan:x.loc};ins.observations.push(rec);var other=x.loc!==ins.rack;ins.scanLog.push({code:code,result:other?"Чужой":"На месте",at:rec.at});toast((other?"Чужой: ":"Добавлен: ")+x.id+". Сканируйте следующий.",other?"warn":"good")}
function inspectScan(code,source){var ins=running();if(!ins)return;code=String(code||"").trim();if(!code)return;
var x=active().find(function(s){return s.id.toLowerCase()===code.toLowerCase()||(s.epc&&s.epc.toLowerCase()===code.toLowerCase())});
if(x){observation(ins,x,code,source);save();render();return}
var p=db.products.find(function(p){return p.barcode===code||p.article.toLowerCase()===code.toLowerCase()});
if(p){var candidates=productSamples(p.id);if(candidates.length===1){observation(ins,candidates[0],code,source+" · однозначный товарный ШК");save();render();return}
ins.unresolved.push({code:code,reason:candidates.length?"У товара "+candidates.length+" экземпляров: нужен уникальный код":"У товара нет активных образцов",candidates:candidates.map(function(s){return s.id})})}
else ins.unresolved.push({code:code,reason:"Неизвестный код",candidates:[]});
ins.scanLog.push({code:code,result:"Уточнить",at:now()});toast("Скан требует уточнения. Можно продолжать.","warn");save();render()}
function finishInspection(){var ins=running();if(!ins)return;if(ins.unresolved.length||db.c5Queue.some(function(q){return q.insId===ins.id})){toast("Сначала разберите нераспознанные сканы и отправьте очередь C5.","error");render();return}
ins.status="finished";ins.finishedAt=now();db.audit.push({id:uid(),kind:"Проверка",at:ins.finishedAt,detail:ins.rack+": чужие "+issues(ins,"wrong",false).length+", не найдены "+issues(ins,"missing",false).length+", на месте "+ins.observations.filter(function(o){return o.registeredLocAtScan===ins.rack}).length,sampleIds:[],requestId:null});save();S.issueType="wrong";S.selected=[];S.page="issues";toast("Проверка завершена. Учётные места не изменялись.");render()}
function resolveUnclear(i){var ins=running(),u=ins?.unresolved[i],el=document.getElementById("resolve-"+i),id=el?.value;if(!u||!id){toast("Сначала выберите конкретный физический экземпляр.","warn");render();return}
var x=sample(id);if(!x?.active||!u.candidates.includes(id)){toast("Экземпляр недоступен.","error");render();return}
if(!window.confirm("Вы физически сверили уникальную маркировку "+id+"? Нельзя выбирать наугад по товарному ШК."))return;
ins.unresolved.splice(i,1);observation(ins,x,u.code,"Уточнение оператором");save();render()}
function chooseIssue(type){S.issueType=type;S.selected=[];S.noticeDetails="";if(S.page!=="issues")go("issues");else render()}
function prepare(action,ids,target,insId){ids=Array.from(new Set(ids)).filter(function(id){return sample(id)?.active});if(!ids.length){toast("Сначала выберите образцы.","warn");render();return}
if(["move","here","foundOther"].includes(action)&&!R.some(function(r){return r.id===target})){toast("Укажите полку назначения.","error");render();return}
if(action==="move"&&ids.some(function(id){return sample(id).loc===target})){toast("В выборе есть образцы, которые уже числятся на целевой полке. Исключите их.","warn");render();return}
if(action==="move"&&insId&&S.issueType==="wrong"&&target===S.rack){toast("Для этой полки используйте «Закрепить здесь».","warn");render();return}
if(action==="here"&&target!==S.rack){toast("Ошибка контекста полки.","error");render();return}
if(action==="foundOther"&&target===S.rack){toast("Для этой полки выберите «Нашёл здесь».","warn");render();return}
var m={action:action,ids:ids,target:target||null,insId:insId||null,issueType:insId?S.issueType:null,versions:Object.fromEntries(ids.map(function(id){return[id,sample(id).version]})),requestId:uid(),origin:S.page==="issues-target"?"issues":S.page};
S.confirm=m;S.simulateConflict=false;S.simulateNetwork=false;
if(ids.length===1&&(action==="here"||(action==="move"&&!insId))){commit(true);return}
go("confirm")}
function prepareCreate(){if(!queueCount()||db.queue.some(function(x){return!x.productId})){toast("Уберите неизвестные коды из партии.","error");render();return}
S.confirm={action:"create",ids:[],target:S.rack,requestId:uid(),origin:S.page,queueSnapshot:JSON.stringify(db.queue)};go("confirm")}
function apply(m){var payload=JSON.stringify({action:m.action,ids:m.ids,target:m.target,insId:m.insId,versions:m.versions,issueType:m.issueType,queueSnapshot:m.queueSnapshot});
var prev=db.requests[m.requestId];if(prev){if(prev.payload!==payload)return{ok:false,message:"REQUEST_ID_CONFLICT"};return prev.response}
if(S.simulateConflict){S.simulateConflict=false;return{ok:false,message:"VERSION_CONFLICT: пакет не применён"}}
if(S.simulateNetwork){S.simulateNetwork=false;return{ok:false,unknown:true,message:"Связь прервалась. Результат неизвестен; повторите тот же requestId."}}
if(m.action==="create"&&JSON.stringify(db.queue)!==m.queueSnapshot)return{ok:false,message:"Очередь создания изменилась. Вернитесь и проверьте партию."};
if(m.action!=="create"){
for(var id of m.ids){var x=sample(id);if(!x?.active||x.version!==m.versions[id])return{ok:false,message:"VERSION_CONFLICT: "+id+" изменился после выбора"}}
if(m.insId){var ins=db.inspections.find(function(x){return x.id===m.insId}),type=m.issueType||(m.action==="here"?"wrong":"missing");
if(!ins||m.ids.some(function(id){return!issues(ins,type,true).some(function(i){return i.sampleId===id})}))return{ok:false,message:"Расхождение уже разобрано или проверка недоступна"}}
}
var newIds=[],t=now();
if(m.action==="create"){db.queue.forEach(function(q){for(var j=0;j<q.qty;j++){var id="S-"+String(db.nextSample++).padStart(6,"0");db.samples.push({id:id,productId:q.productId,loc:m.target,active:true,version:1,labeled:false,epc:null,epcHistory:[],createdAt:t});newIds.push(id)}});db.queue=[];db.lastCreatedIds=newIds.slice()}
else m.ids.forEach(function(id){var x=sample(id),old=x.loc;
if(m.action==="remove"){x.active=false;x.removedAt=t;x.version++;if(x.epcHistory?.length&&x.epcHistory[x.epcHistory.length-1].to===null)x.epcHistory[x.epcHistory.length-1].to=t;x.epc=null}
else if(["move","here","foundOther"].includes(m.action)&&x.loc!==m.target){x.loc=m.target;x.version++}
if(m.insId&&["here","found","foundOther","move"].includes(m.action)){var ins=db.inspections.find(function(y){return y.id===m.insId});db.resolutions.push({key:key(ins,m.issueType||(m.action==="here"?"wrong":"missing"),id),at:t,action:m.action,target:m.target||ins.rack,requestId:m.requestId})}
db.audit.push({id:uid(),kind:({remove:"Исключение",move:"Перемещение",here:"Исправление места",found:"Подтверждение обнаружения",foundOther:"Обнаружение и перемещение"})[m.action],at:t,detail:id+": "+old+" → "+(m.action==="remove"?"исключён":m.action==="found"?"найден на "+m.target:m.target),sampleIds:[id],requestId:m.requestId})});
if(m.action==="create")db.audit.push({id:uid(),kind:"Создание",at:t,detail:"Создано "+newIds.length+" образцов на "+m.target+"; ожидают маркировки",sampleIds:newIds,requestId:m.requestId});
var response={ok:true,message:m.action==="create"?"Создано "+newIds.length+" образцов. Теперь маркировка.":"Выполнено: "+m.ids.length+" образцов.",newIds:newIds};
db.requests[m.requestId]={payload:payload,response:response,at:t};save();return response}
function commit(silent){var m=S.confirm;if(!m)return;
if((["remove","found","foundOther"].includes(m.action)||(m.action==="move"&&m.insId))&&!silent&&!document.getElementById("ack")?.checked){toast("Подтвердите физическое действие.","warn");render();return}
var result=apply(m);if(!result.ok){toast(result.message,result.unknown?"warn":"error");render();return}
S.confirm=null;S.selected=[];S.noticeDetails="";S.focusId=null;
if(m.action==="create"){S.newIds=result.newIds;S.stack=[];S.page="labels"}
else{S.page=m.origin;S.stack=S.stack.filter(function(p){return p!=="confirm"&&p!=="issues-target"});if(S.stack[S.stack.length-1]===m.origin)S.stack.pop()}
toast(result.message);render()}
function c5Scan(code){var ins=running();if(!ins){toast("Сначала начните проверку полки.","warn");render();return}
var ev={id:uid(),insId:ins.id,code:code,at:now()};if(!db.c5Online){db.c5Queue.push(ev);save();toast("C5 офлайн: скан сохранён в очереди. Не отправлено: "+db.c5Queue.length,"warn");render();return}
if(!db.deliveredEvents[ev.id]){db.deliveredEvents[ev.id]=true;inspectScan(code,"C5 · демо")}else{toast("Повтор события C5 проигнорирован.","warn");render()}save()}
function syncC5(){if(!db.c5Online){toast("C5 офлайн. Включите сеть.","warn");render();return}
var n=0;while(db.c5Queue.length){var ev=db.c5Queue.shift();if(db.deliveredEvents[ev.id])continue;db.deliveredEvents[ev.id]=true;var ins=db.inspections.find(function(x){return x.id===ev.insId});if(ins&&ins.status==="active"){inspectScan(ev.code,"C5 · офлайн-очередь");n++}}
save();toast("Синхронизировано событий: "+n+". Повторные eventId не применяются.");render()}
function bindEpc(){var x=sample(S.focusId),v=document.getElementById("epc-input")?.value.trim().toUpperCase();if(!x?.active||!v){toast("Введите EPC для активного образца.","warn");render();return}
if(active().some(function(y){return y.id!==x.id&&y.epc?.toUpperCase()===v})){toast("Этот EPC уже привязан к другому активному образцу.","error");render();return}
if(x.epc===v){toast("EPC не изменился.","warn");render();return}
if(!window.confirm("Подтверждаете физическую привязку EPC "+v+" к "+x.id+"?"))return;
var t=now();if(x.epcHistory.length&&x.epcHistory[x.epcHistory.length-1].to===null)x.epcHistory[x.epcHistory.length-1].to=t;
x.epc=v;x.epcHistory.push({epc:v,from:t,to:null});x.version++;db.audit.push({id:uid(),kind:"Привязка EPC",at:t,detail:x.id+" → "+v,sampleIds:[x.id],requestId:uid()});save();toast("EPC привязан. История интервалов сохранена.");render()}
function act(a){if(a==="back"){back();return}if(a==="unchecked"){S.onlyUnchecked=true;S.page="warehouse";render();return}if(a==="show-all-racks"){S.onlyUnchecked=false;render();return}
if(a.startsWith("nav-")){var page=a.slice(4);if(page==="warehouse")S.onlyUnchecked=false;if(page==="inspection")page="inspection";S.selected=[];S.focusId=page==="find"?S.focusId:null;go(page);return}
if(a.startsWith("rack-")||a.startsWith("check-")){var check=a.startsWith("check-"),id=a.slice(check?6:5);if(running()&&running().rack!==id){toast("Сначала завершите активную проверку "+running().rack,"warn");render();return}S.rack=id;S.selected=[];go(check?"inspection":"work");return}
if(a==="shelf"){S.afterShelf=null;go("shelf");return}
if(a==="labels"){S.newIds=db.lastCreatedIds.slice();go("labels");return}
if(a==="create"||a==="inspection"||a==="move"||a==="remove"){S.selected=[];S.target="";go(a);return}
if(a==="start-inspection"){startInspection();return}
if(a==="finish-inspection"){finishInspection();return}
if(a==="cancel-inspection"){var ins=running();if(ins&&window.confirm("Отменить незавершённую проверку "+ins.rack+"? Только её наблюдения будут потеряны.")){ins.status="cancelled";ins.finishedAt=now();db.c5Queue=db.c5Queue.filter(function(q){return q.insId!==ins.id});save();toast("Проверка отменена. Учёт не менялся.");S.page="work";render()}return}
if(a==="c5-example"){c5Scan("S-000001");return}
if(a.startsWith("resolve-")){resolveUnclear(Number(a.slice(8)));return}
if(a.startsWith("discard-")){var i=Number(a.slice(8)),ins=running();if(ins){ins.unresolved.splice(i,1);save();toast("Ошибочный скан убран. Остальные наблюдения сохранены.");render()}return}
if(a==="issues-wrong"||a==="issues-missing"){chooseIssue(a.slice(7));return}
if(a==="select-all"){var ins=latest(S.rack);S.selected=issues(ins,S.issueType,true).map(function(x){return x.sampleId});render();return}
if(a==="select-none"){S.selected=[];render();return}
if(a.startsWith("unselect-")){selectId(a.slice(9),false);render();return}
if(a.startsWith("single-here-")){var id=a.slice(12);prepare("here",[id],S.rack,latest(S.rack)?.id);return}
if(a.startsWith("single-found-")&&!a.startsWith("single-found-other-")){prepare("found",[a.slice(13)],S.rack,latest(S.rack)?.id);return}
if(a.startsWith("single-found-other-")){var id=a.slice(19);S.selected=[id];S.issueType="missing";S.issueAction="foundOther";S.noticeDetails="Выберите целевую полку для найденного образца в поле ниже.";go("issues-target");return}
if(a.startsWith("where-")){var x=sample(a.slice(6)),i=issues(latest(S.rack),"wrong",true).find(function(z){return z.sampleId===x?.id});S.noticeDetails=x?.id+" при проверке числился на полке "+(i?.from||x?.loc)+". Это памятка, учёт не изменён.";render();return}
if(a==="bulk-where"){S.noticeDetails=S.selected.map(function(id){var x=sample(id),i=issues(latest(S.rack),"wrong",true).find(function(z){return z.sampleId===id});return id+" → "+(i?.from||x?.loc)}).join("; ")+". Это памятка, учёт не изменён.";render();return}
if(a==="bulk-here"){prepare("here",S.selected,S.rack,latest(S.rack)?.id);return}
if(a==="bulk-found"){prepare("found",S.selected,S.rack,latest(S.rack)?.id);return}
if(a==="bulk-remove"){prepare("remove",S.selected,null,latest(S.rack)?.id);return}
if(a==="bulk-other"||a==="bulk-found-other"){S.issueAction=a==="bulk-other"?"move":"foundOther";go("issues-target");return}
if(a==="issue-target-submit"){var t=document.getElementById("issue-target")?.value;prepare(S.issueAction,S.selected,t,latest(S.rack)?.id);return}
if(a==="move-review"){var t=document.getElementById("target-rack")?.value;prepare("move",S.selected,t);return}
if(a==="remove-review"){prepare("remove",S.selected);return}
if(a==="create-review"){prepareCreate();return}
if(a==="commit"){commit(false);return}
if(a==="simulate-conflict"){S.simulateConflict=true;S.simulateNetwork=false;toast("Следующее подтверждение покажет VERSION_CONFLICT.","warn");render();return}
if(a==="simulate-network"){S.simulateNetwork=true;S.simulateConflict=false;toast("Следующее подтверждение покажет неопределённый результат; requestId сохранится.","warn");render();return}
if(a==="demo-create"){db.queue=db.products.slice(0,100).map(function(p){return{code:p.barcode,productId:p.id,qty:1}});save();toast("В очереди 100 товаров. Создание не выполнялось.");render();return}
if(a==="clear-queue"){if(window.confirm("Очистить всю очередь создания?")){db.queue=[];save();render()}return}
if(a.startsWith("qinc-")||a.startsWith("qdec-")||a.startsWith("qdel-")){var op=a.slice(0,4),i=Number(a.slice(5));if(!db.queue[i])return;if(op==="qinc")db.queue[i].qty++;else if(op==="qdec"){db.queue[i].qty--;if(db.queue[i].qty<=0)db.queue.splice(i,1)}else db.queue.splice(i,1);save();render();return}
if(a==="print-labels"){window.print();return}
if(a.startsWith("detail-")&&a!=="detail-move"&&a!=="detail-remove"&&a!=="detail-history"){S.focusId=a.slice(7);S.search=S.focusId;go("find");return}
if(a==="detail-move"){S.selected=[S.focusId];S.target="";go("move");return}
if(a==="detail-remove"){S.selected=[S.focusId];go("remove");return}
if(a==="detail-history"){go("history");return}
if(a==="clear-history-filter"){S.focusId=null;render();return}
if(a==="bind-epc"){bindEpc();return}
if(a.startsWith("report-")){var id=a.slice(7);if(id==="prev"||id==="next"){S.reportPage=Math.max(0,S.reportPage+(id==="next"?1:-1))}else{S.reportTab=id;S.reportPage=0;S.reportSearch=""}render();return}
if(a.startsWith("report-issue-")){var m=a.match(/^report-issue-(wrong|missing)-(.+)$/);if(m){S.rack=m[2];S.issueType=m[1];S.selected=[];go("issues")}return}
if(a.startsWith("report-add-")){var p=product(Number(a.slice(11)));if(p){var q=db.queue.find(function(x){return x.productId===p.id});if(q)q.qty++;else db.queue.push({code:p.barcode,productId:p.id,qty:1});save();S.afterShelf="create";go("shelf");toast("Добавлен "+p.article+" в очередь. Выберите полку перед созданием.");render()}return}
if(a==="toggle-c5"){db.c5Online=!db.c5Online;save();toast("C5 (демо): "+(db.c5Online?"в сети":"офлайн"));render();return}
if(a==="sync-c5"){syncC5();return}
if(a==="c5-scan"){var v=document.getElementById("c5-code")?.value.trim();if(v)c5Scan(v);return}
if(a==="export-demo"){db.lastBackup=now();save();var data=JSON.stringify(db,null,2),blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="fabric-samples-demo-v6-backup.json";link.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("Демо-данные экспортированы в JSON.");render();return}
if(a==="import-demo"){document.getElementById("backup-file")?.click();return}
if(a==="stress-10k"){if(db.products.length>=10000){toast("В каталоге уже "+db.products.length+" товаров.","warn");render();return}for(var n=db.products.length+1;n<=10000;n++){db.products.push({id:n,name:names[(n-1)%names.length]+" / "+String(n).padStart(5,"0"),article:"ART-"+String(n).padStart(5,"0"),barcode:"460000"+String(n).padStart(7,"0"),stock:n%4===0?0:(n*7)%38+1})}save();toast("Демо-каталог расширен до 10 000 товаров. Отчёты показывают 30 строк на страницу.");render();return}
if(a==="reset-demo"){if(window.confirm("Сбросить ВСЕ изменения макета и вернуть исходные вымышленные данные?")){db=seed();S.selected=[];S.stack=[];S.page="warehouse";save();toast("Демоданные сброшены.");render()}return}
}
function renderIssueTarget(){frame(head("Куда переместить найденные образцы?","Выберите фактическую полку. Само обнаружение не меняло учёт.")+
'<section class="panel stack"><h2>Выбрано: '+S.selected.length+'</h2><div class="field"><label for="issue-target">Целевая полка</label><select id="issue-target" class="input">'+options("",true)+'</select></div>'+
'<div class="row">'+B("Назад","back")+B("Продолжить","issue-target-submit","primary big")+'</div></section>')}
var baseRender=render;render=function(){if(S.page==="issues-target")renderIssueTarget();else baseRender()};
function bind(){root.querySelectorAll("[data-act]").forEach(function(el){el.onclick=function(){act(el.dataset.act)}});
root.querySelectorAll("[data-select]").forEach(function(el){el.onchange=function(){selectId(el.dataset.select,el.checked);render()}});
function scanInput(id,fn){var el=document.getElementById(id);if(el)el.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();var v=el.value.trim();el.value="";fn(v)}}}
scanInput("create-scan",createScan);scanInput("inspection-scan",function(v){inspectScan(v,"USB HID / клавиатура")});
scanInput("move-scan",function(v){var x=active().find(function(s){return s.id.toLowerCase()===v.toLowerCase()||s.epc?.toLowerCase()===v.toLowerCase()});if(!x){toast("Нужен уникальный код образца или EPC.","error")}else{selectId(x.id,true);toast("Выбран "+x.id)}render()});
scanInput("remove-scan",function(v){var x=active().find(function(s){return s.id.toLowerCase()===v.toLowerCase()||s.epc?.toLowerCase()===v.toLowerCase()});if(!x){toast("Нужен уникальный код образца или EPC.","error")}else{selectId(x.id,true);toast("Выбран "+x.id)}render()});
scanInput("label-scan",function(v){var x=labelIds().map(sample).find(function(s){return s?.id.toLowerCase()===v.toLowerCase()});if(!x){toast("Код не относится к только что созданной партии.","error")}else if(x.labeled){toast("Маркировка уже подтверждена.","warn")}else{x.labeled=true;x.version++;db.audit.push({id:uid(),kind:"Маркировка",at:now(),detail:"Подтверждена этикетка "+x.id,sampleIds:[x.id],requestId:uid()});save();toast("Маркировка подтверждена: "+x.id)}render()});
scanInput("shelf-scan",setShelf);var ss=document.getElementById("shelf-select");if(ss)ss.onchange=function(){setShelf(ss.value)};
var sr=document.getElementById("global-search");if(sr)sr.oninput=function(){var pos=sr.selectionStart;S.search=sr.value;S.focusId=null;render();var e=document.getElementById("global-search");if(e){e.focus();e.setSelectionRange(pos,pos)}};
var rr=document.getElementById("report-search");if(rr)rr.oninput=function(){var pos=rr.selectionStart;S.reportSearch=rr.value;S.reportPage=0;render();var e=document.getElementById("report-search");if(e){e.focus();e.setSelectionRange(pos,pos)}};
var rf=document.getElementById("remove-filter");if(rf)rf.onchange=function(){S.removeFilter=rf.value;render()};
var tf=document.getElementById("target-rack");if(tf)tf.onchange=function(){S.target=tf.value};
var backup=document.getElementById("backup-file");if(backup)backup.onchange=function(){var file=backup.files?.[0];if(!file)return;file.text().then(function(t){try{var v=JSON.parse(t);if(v.schema!==6||!Array.isArray(v.samples)||!Array.isArray(v.inspections)||!Array.isArray(v.products)||!Array.isArray(v.audit)||!Array.isArray(v.resolutions))throw Error("Несовместимый формат");if(!window.confirm("Заменить все текущие ДЕМО-данные содержимым файла?"))return;db=v;save();S.page="warehouse";S.stack=[];S.selected=[];toast("Демоданные восстановлены из JSON.");render()}catch(e){toast("Импорт отклонён: "+e.message,"error");render()}})}
}
window.__v6Test={get db(){return db},S:S,issues:issues,latest:latest,allIssues:allIssues,act:act,go:go,back:back,startInspection:startInspection,inspectScan:inspectScan,finishInspection:finishInspection,prepare:prepare,apply:apply,commit:commit,render:render,save:save,seed:seed};
render();
})();
</script>
</body>
