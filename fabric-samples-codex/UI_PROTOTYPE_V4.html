<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Образцы тканей — обзор склада и работа v4</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83a9ff;outline-offset:2px}
.wrap{max-width:1260px;margin:auto;padding:18px 24px 55px}.demo{background:#e9f0ff;border:1px solid #c7d8ff;color:#34548b;padding:10px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.logo{font-size:20px;font-weight:850;letter-spacing:-.04em}.logo small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.shelf{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#112847;color:white;border-radius:16px;padding:20px 25px;margin-bottom:20px;box-shadow:var(--shadow)}.shelf .kicker{font-size:13px;font-weight:800;color:#b8d3ff;text-transform:uppercase;letter-spacing:.07em}.shelf .code{font-size:36px;letter-spacing:.015em;font-weight:900;line-height:1.2}.shelf .name{font-size:14px;color:#d4e1f4}.shelf .btn{border-color:#6787b3;background:#fff;color:#142a4b}
h1{font-size:27px;letter-spacing:-.035em;line-height:1.2;margin:0 0 7px}h2{font-size:20px;letter-spacing:-.02em;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 12px}.sub{color:var(--muted);font-size:15px}.eyebrow{color:#63768e;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid #b9cbe1;background:white;color:#1b3d68;padding:11px 17px;min-height:46px;font-size:15px;font-weight:750;white-space:normal;text-align:center}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#174bc3}.btn.success{background:var(--green);border-color:var(--green);color:white}.btn.danger{background:var(--red);border-color:var(--red);color:white}.btn.ghost{background:#f6f9fd}.btn:disabled{opacity:.45}.btn.big{min-height:56px;font-size:17px;padding:13px 22px}.btn.small{min-height:38px;font-size:13px;padding:7px 11px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:14px;font-weight:750;color:#465c77}.input{width:100%;border:1px solid #aebfd6;background:white;border-radius:10px;min-height:48px;padding:10px 13px;font-size:16px;color:var(--ink)}.input.scan{min-height:58px;font-size:19px;font-weight:650}.field.grow{flex:1}.field.short{flex:0 1 260px}
.notice{border-radius:10px;padding:13px 16px;font-size:15px;background:#ecf3ff;color:#244c91;border:1px solid #cddfff}.notice.good{background:var(--green2);border-color:#afe0c5;color:#08613f}.notice.warn{background:var(--yellow2);border-color:#efd6a5;color:#805006}.notice.error{background:var(--red2);border-color:#edb6be;color:#a12439}
.stat{background:#f5f8fc;border:1px solid #e7edf5;border-radius:11px;padding:15px}.stat b{font-size:28px;line-height:1.2;display:block}.stat span{font-size:13px;color:var(--muted)}.stat.warn b{color:var(--red)}.stat.yellow b{color:var(--yellow)}.stat.good b{color:var(--green)}
.line{border:0;border-top:1px solid #e1e7f0;margin:18px 0}.tag{display:inline-block;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:800;white-space:nowrap}.tag.bad{background:var(--red2);color:var(--red)}.tag.ok{background:var(--green2);color:var(--green)}.tag.maybe{background:var(--yellow2);color:var(--yellow)}.tag.neutral{background:#eef2f6;color:#5a6b81}
.steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.step{padding:7px 12px;border-radius:7px;background:#e8edf4;color:#65758b;font-size:13px;font-weight:750}.step.active{background:#dce8ff;color:#1b56c5}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:400px}.tbl{border-collapse:collapse;width:100%;min-width:680px}.tbl th{background:#f0f5fb;position:sticky;top:0;z-index:1;color:#4d637e;text-align:left;font-size:13px;padding:12px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 12px;border-bottom:1px solid #e9eef4;font-size:14px}.tbl tbody tr:hover{background:#f8fbff}.tbl td strong{font-size:15px}.tbl small{color:var(--muted)}.tbl tr.chosen{background:#edf4ff}.tbl th:last-child,.tbl td:last-child{text-align:right}.tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);cursor:pointer}.mini{min-width:37px;min-height:37px;border:1px solid #b9cbe1;background:white;border-radius:7px;font-weight:800;color:#244c91}
.bar{position:sticky;bottom:10px;background:white;border:2px solid #cbd9ec;border-radius:13px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 25px #18395d22;z-index:3}.bar strong{font-size:18px}.muted{color:var(--muted)}.tiny{font-size:13px;color:var(--muted)}.counter{font-size:28px;font-weight:900;color:#215be7}.info{background:#f6f9fc;border-radius:11px;padding:14px 17px}.preview{background:#f5f8fc;border:1px solid #e4ebf4;border-radius:11px;padding:16px;max-height:270px;overflow:auto}.preview div{padding:4px 0}.confirm{max-width:800px;margin:auto}.choice{display:flex;flex-direction:column;gap:10px}.choice button{text-align:left;display:block;white-space:normal}.choice button strong{display:block;font-size:17px}.choice button small{display:block;color:#63738a;font-size:14px;font-weight:400;margin-top:4px}.choice button.selected{background:#edf4ff;border:2px solid var(--blue)}.checklabel{display:flex;align-items:center;gap:11px;font-weight:700}.checklabel input{width:22px;height:22px;accent-color:var(--blue)}.foot{margin-top:24px;text-align:center;font-size:12px;color:#8492a4}
.globalnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.globalnav .btn{min-width:130px}.globalnav .active{background:#dce9ff;color:#184aa4;border-color:#a9c6ff}
.dashstat{border:1px solid var(--line);background:white;border-radius:13px;padding:19px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:139px;box-shadow:var(--shadow);width:100%}
.dashstat:hover{border-color:#79a0ef}.dashstat b{font-size:35px;line-height:1.15}.dashstat strong{font-size:15px}.dashstat small{font-size:13px;color:var(--muted)}
.dashstat .go{font-size:13px;color:var(--blue);font-weight:800;margin-top:auto}
.dashstat.warn b{color:var(--red)}.dashstat.yellow b{color:var(--yellow)}.dashstat.good b{color:var(--green)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rackcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;display:flex;flex-direction:column;gap:9px}
.rackcard h3{font-size:23px;margin:0}.rackcard .data{font-size:14px;color:#4c5e78}.rackcard .data b{color:var(--ink)}
.tabrow{display:flex;gap:8px;flex-wrap:wrap}.tabrow .btn{white-space:normal}
.minihead{font-size:12px;letter-spacing:.07em;color:#657890;text-transform:uppercase;font-weight:800}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px}.nav .btn{min-width:105px}
.scanstate{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--green);font-size:17px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#13a876}
.logline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-bottom:1px solid #e5ebf3}.logline:last-child{border:0}.logline small{font-size:12px;color:var(--muted)}
.problem{border:1px solid #efd6a5;background:#fffbf2;padding:13px;border-radius:9px;display:flex;flex-direction:column;gap:8px}

@media(max-width:750px){.wrap{padding:12px}.grid,.grid3{grid-template-columns:1fr}.shelf{padding:17px;align-items:flex-start}.shelf .code{font-size:30px}.panel{padding:16px}.task{min-height:108px;padding:16px}.top{align-items:flex-start}.btn{white-space:normal}}
</style></head><body><div id="app"></div>
<script>
(function(){"use strict";
const R=[{id:"A-02-03",name:"Стеллаж A · секция 02 · полка 03"},{id:"B-01-02",name:"Стеллаж B · секция 01 · полка 02"},{id:"C-01-04",name:"Стеллаж C · секция 01 · полка 04"},{id:"D-03-01",name:"Стеллаж D · секция 03 · полка 01"}];
const names=["Лён натуральный","Блэкаут графит","Велюр песочный","Сатин белый","Рогожка серый меланж","Шенилл оливковый","Хлопок экрю","Жаккард синий","Тюль молочный","Габардин бежевый","Микровелюр капучино","Твид коричневый","Букле кремовый","Муслин серый","Оксфорд тёмно-синий"];
const products=Array.from({length:140},(_,i)=>({id:i+1,name:names[i%names.length]+" / "+String(i+1).padStart(3,"0"),article:"ART-"+String(i+1).padStart(4,"0"),barcode:"460000"+String(i+1).padStart(7,"0"),stock:(i+1)%4===0?0:((i+1)*7)%38+1}));
const samples=Array.from({length:80},(_,i)=>{let n=i+1;return {id:"S-"+String(n).padStart(6,"0"),p:n,loc:n<=50?(n%2?"A-02-03":"C-01-04"):n<=70?"B-01-02":"C-01-04",seen:n<=50?"B-01-02":n<=58?null:n<=70?"B-01-02":"C-01-04",deleted:false,version:1,inspected:n<=70?"demo-1":null}});
let nextId=300;
let history=[{kind:"Проверка",desc:"Демонстрационная проверка полки B-01-02: 50 чужих, 8 не найдены."}];
let S={page:"overview",rack:"B-01-02",flash:"",flashKind:"",scan:"",queue:[],created:[],selected:[],issue:"wrong",removeFilter:"zero",action:"",target:"",preview:null,confirmDelete:false,conflict:false,network:false,inspection:{id:"demo-1",rack:"B-01-02",finished:true,seen:samples.filter(x=>x.seen==="B-01-02").map(x=>x.id),expected:samples.filter(x=>x.loc==="B-01-02").map(x=>x.id),label:"Демо: завершена сегодня в 10:21",source:"C5 / демонстрация"},inspectionScan:"",shelfReturn:"overview",afterShelf:null,analyticsTab:"no",analyticsSearch:"",analyticsSelected:[],result:null};
S.lastByRack={"B-01-02":S.inspection};
const $=x=>document.getElementById(x), E=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=id=>products.find(x=>x.id===id), rack=id=>(R.find(x=>x.id===id)||{}).name||id;
function options(current,empty){return (empty?'<option value="">Выберите полку...</option>':"")+R.map(r=>'<option value="'+r.id+'" '+(r.id===current?"selected":"")+'>'+E(r.id)+" — "+E(r.name)+'</option>').join("")}
function btn(t,a,cls,disabled){return '<button type="button" class="btn '+(cls||"")+'" data-a="'+a+'" '+(disabled?"disabled":"")+'>'+t+'</button>'}
function note(t,kind){S.flash=t;S.flashKind=kind||"good"}
function notice(){return S.flash?'<div class="notice '+S.flashKind+'" role="status">'+E(S.flash)+'</div>':""}
function title(t,sub){return '<div class="eyebrow">УЧЁТ ФИЗИЧЕСКИХ ОБРАЗЦОВ</div><h1>'+t+'</h1><p class="sub">'+sub+'</p>'}
function steps(names,at){return '<div class="steps">'+names.map((n,i)=>'<span class="step '+(i===at?"active":"")+'">'+(i+1)+". "+n+'</span>').join("")+'</div>'}
function frame(inner){let cancel=S.page==="inspect"&&S.inspection&&!S.inspection.finished&&S.inspection.rack===S.rack?btn("Отменить проверку","inspect-cancel","",false):S.page==="create"&&queueCount()?btn("Отменить создание","create-cancel","",false):"";
let global=["overview","analytics","racks"].includes(S.page);
let menu='<div class="globalnav">'+btn("Обзор склада","overview",S.page==="overview"?"active":"")+btn("Все полки","racks",S.page==="racks"?"active":"")+btn("Аналитика","analytics",S.page==="analytics"?"active":"")+btn("Работа на полке","home",!global?"active":"")+'</div>';
$("app").innerHTML='<div class="wrap"><div class="demo"><b>ИНТЕРАКТИВНЫЙ МАКЕТ v4.</b> Все цифры и остатки вымышленные; 1С и оборудование не подключены. После обновления страницы всё сбрасывается.</div><div class="top"><div class="logo">▤ Образцы тканей<small>Обзор всего склада · простая работа с образцами</small></div><span class="tag neutral">Демо · оператор</span></div>'+menu+
(!global?'<div class="nav">'+btn("← Назад","back","ghost")+btn("⌂ Обзор склада","overview","ghost")+cancel+'</div><div class="shelf"><div><div class="kicker">Рабочая полка — только для текущей операции</div><div class="code">'+E(S.rack)+'</div><div class="name">'+E(rack(S.rack))+'</div></div>'+btn("Сменить полку","shelf","")+'</div>':"")+
notice()+'<main class="stack">'+inner+'</main><div class="foot">Интерактивный шаблон для согласования · данные не сохраняются · версия v4</div></div';bind();if(S.page==="create"&&S.createStep==="scan"){$("scan")?.focus()}if(S.page==="inspect"&&S.inspection&&!S.inspection.finished&&S.inspection.rack===S.rack){$("inscan")?.focus()}}
function latest(){let a=S.lastByRack[S.rack];return a&&a.finished?a:null}
function wrongRows(){let a=latest();return a?samples.filter(x=>!x.deleted&&x.inspected===a.id&&x.seen===S.rack&&x.loc!==S.rack):[]}
function missingRows(){let a=latest();return a?samples.filter(x=>!x.deleted&&a.expected.includes(x.id)&&!a.seen.includes(x.id)):[]}
function okRows(){let a=latest();return a?samples.filter(x=>!x.deleted&&a.seen.includes(x.id)&&x.loc===S.rack):[]}

function activeSamples(){return samples.filter(x=>!x.deleted)}
function noSampleProducts(){let ids=new Set(activeSamples().map(x=>x.p));return products.filter(p=>!ids.has(p.id))}
function zeroCandidates(){return activeSamples().filter(x=>P(x.p)?.stock===0)}
function snap(r){return S.lastByRack[r]||null}
function rackWrong(r){let a=snap(r);return a?samples.filter(x=>!x.deleted&&x.inspected===a.id&&x.seen===r&&x.loc!==r):[]}
function rackMissing(r){let a=snap(r);return a?samples.filter(x=>!x.deleted&&a.expected.includes(x.id)&&!a.seen.includes(x.id)):[]}
function rackOk(r){let a=snap(r);return a?samples.filter(x=>!x.deleted&&a.seen.includes(x.id)&&x.loc===r):[]}
function allWrong(){return R.flatMap(r=>rackWrong(r.id))}
function allMissing(){return R.flatMap(r=>rackMissing(r.id))}
function overview(){let active=activeSamples(),no=noSampleProducts(),zero=zeroCandidates(),wrong=allWrong(),missing=allMissing(),checked=R.filter(r=>snap(r.id)).length;
frame(title("Обзор всего склада","Здесь показаны все образцы и проблемы по всем полкам. Выбор рабочей полки нужен только для конкретной операции.")+
'<div class="notice">Состояние на основе <b>демонстрационных данных</b>. Проверено полок: <b>'+checked+' из '+R.length+'</b>. На непроверенных полках нельзя считать образцы отсутствующими.</div>'+
'<div class="grid4">'+
dash(active.length,"Активных образцов","Все физические экземпляры","all","")+
dash(no.length,"Товаров без образца","Проверить, каким товарам нужны образцы","no","yellow")+
dash(wrong.length,"Образцов не на месте","Обнаружены при завершённых проверках","wrong","warn")+
dash(missing.length,"Не найдены","Только после завершённых проверок","missing","yellow")+
dash(zero.length,"Кандидатов на пересмотр","Образцы товаров с остатком 0 (демо)","zero","yellow")+
dash(products.length,"Товаров в каталоге","Из демонстрационного каталога","no","")+
dash(checked+" / "+R.length,"Полок проверено","Остальные требуют проверки","racks","")+
dash(active.filter(x=>!x.inspected).length,"Без наблюдений","Ни разу не сканировались в демо","racks","")+
'</div>'+
'<section class="panel stack"><div class="row between"><div><h2>Состояние по полкам</h2><p class="sub">Нажмите «Открыть полку», чтобы выбрать рабочее место. Прочерк означает «нет данных проверки», а не ноль.</p></div>'+btn("Все полки и проверки","racks","primary")+'</div>'+rackTable()+'</section>'+
'<section class="panel stack"><h2>Что требует внимания</h2><div class="grid3">'+
'<button class="task" data-a="analyt-no"><span class="sym">＋</span><span><strong>Товары без образцов · '+no.length+'</strong><small>Открыть список товаров и сформировать партию для создания.</small></span></button>'+
'<button class="task" data-a="analyt-wrong"><span class="sym">↔</span><span><strong>Исправить места · '+wrong.length+'</strong><small>Посмотреть, на каких полках нашли чужие образцы.</small></span></button>'+
'<button class="task" data-a="analyt-zero"><span class="sym">?</span><span><strong>Проверить необходимость · '+zero.length+'</strong><small>Нулевой остаток — только сигнал к ручному решению.</small></span></button></div></section>')}
function dash(n,label,desc,tab,cls){return '<button class="dashstat '+cls+'" data-a="'+(tab==="racks"?"racks":"analyt-"+tab)+'"><b>'+E(n)+'</b><strong>'+E(label)+'</strong><small>'+E(desc)+'</small><span class="go">Открыть список →</span></button>'}
function rackTable(){return '<div class="tablebox"><table class="tbl"><thead><tr><th>Полка</th><th>Числятся</th><th>Проверка</th><th>Чужие</th><th>Не найдены</th><th>Работа</th></tr></thead><tbody>'+R.map(r=>{let a=snap(r.id),n=activeSamples().filter(x=>x.loc===r.id).length;return '<tr><td><strong>'+E(r.id)+'</strong><br><small>'+E(r.name)+'</small></td><td>'+n+'</td><td><span class="tag '+(a?"ok":"maybe")+'">'+(a?"Проверена":"Не проверялась")+'</span></td><td>'+(a?rackWrong(r.id).length:"—")+'</td><td>'+(a?rackMissing(r.id).length:"—")+'</td><td><button class="btn small" data-rackgo="'+r.id+'">Открыть полку</button></td></tr>'}).join("")+'</tbody></table></div>'}
function racksPage(){frame(title("Все полки склада","Здесь видны все места хранения, включая те, которые ещё не проверялись.")+'<section class="panel stack"><div class="grid">'+R.map(r=>{let a=snap(r.id),n=activeSamples().filter(x=>x.loc===r.id).length;return '<div class="rackcard"><div class="row between"><h3>'+E(r.id)+'</h3><span class="tag '+(a?"ok":"maybe")+'">'+(a?"Проверена":"Не проверялась")+'</span></div><div class="sub">'+E(r.name)+'</div><div class="data"><b>'+n+'</b> образцов числится</div><div class="data">Чужие: <b>'+(a?rackWrong(r.id).length:"нет данных")+'</b> · Не найдены: <b>'+(a?rackMissing(r.id).length:"нет данных")+'</b></div><div class="tiny">'+(a?E(a.label)+" · "+E(a.source):"Нет завершённой проверки")+'</div><div class="row">'+btn("Работать с полкой","openrack-"+r.id,"primary")+btn("Проверить","checkrack-"+r.id)+'</div></div>'}).join("")+'</div></section>')}
function analyticsTabs(){let arr=[["no","Товары без образца",noSampleProducts().length],["wrong","Не на месте",allWrong().length],["missing","Не найдены",allMissing().length],["zero","Кандидаты на пересмотр",zeroCandidates().length],["all","Все образцы",activeSamples().length]];return '<div class="tabrow">'+arr.map(([id,label,n])=>btn(label+" · "+n,"analyt-"+id,S.analyticsTab===id?"primary":"")).join("")+'</div>'}
function analytics(){let tab=S.analyticsTab,term=S.analyticsSearch.toLowerCase().trim();let intro={no:"Товары из каталога, для которых нет ни одного активного физического образца. Отсутствие образца не означает, что его обязательно создавать.",wrong:"Образцы, обнаруженные на чужих полках в последних завершённых проверках. Не смешивать с непроверенными полками.",missing:"Образцы, которые числились на полке при начале проверки, но не были найдены к её завершению. Это не удаление.",zero:"Физические образцы товаров с нулевым остатком в демонстрационном каталоге. Удаление — отдельное решение оператора.",all:"Все активные физические образцы, независимо от полки и результатов проверок."}[tab];

(tab==="no"?'<div class="row">'+btn("Выбрать все "+filtered.length,"analytics-all","",!filtered.length)+'<span>Выбрано: <b>'+selected+'</b></span>'+btn("Добавить выбранные в очередь","analytics-create","primary big",!selected)+'</div>':"")+
table+
(tab==="zero"?'<div class="row">'+btn("Перейти к ручному отбору на удаление","remove","danger big")+'</div>':"")+
(tab==="wrong"||tab==="missing"?'<div class="notice warn">Чтобы исправить места, откройте полку, на которой проводилась проверка, и выберите нужное действие. Сам отчёт ничего не перемещает.</div>':"")+
'</section>')}

function render(){if(S.page==="overview")overview();else if(S.page==="analytics")analytics();else if(S.page==="racks")racksPage();else if(S.page==="home")home();else if(S.page==="shelf")shelfPage();else if(S.page==="create")create();else if(S.page==="inspect")inspect();else if(S.page==="afterInspect")afterInspect();else if(S.page==="fix")fix();else if(S.page==="fixAction")fixAction();else if(S.page==="preview")preview();else if(S.page==="remove")removePage();else if(S.page==="result")result();else if(S.page==="history")historyPage()}
function addScan(code){code=String(code||"").trim();if(!code){note("Отсканируйте товарный штрихкод.","warn");render();return}
if(code.toUpperCase().startsWith("RACK:")){note("Это код полки, а здесь нужен товарный штрихкод. Полку меняют отдельно.","error");S.scan="";render();return}
let p=products.find(x=>x.barcode===code||x.article.toUpperCase()===code.toUpperCase());let x=S.queue.find(x=>x.code===code);if(x)x.qty++;else S.queue.push({code,p:p?.id||null,qty:1});S.scan="";note(p?"Добавлен "+p.article+". Всего образцов: "+queueCount():"Код не найден: "+code+". Уберите ошибочную строку.",""+(p?"good":"error"));render()}
function startInspection(){if(S.inspection&&!S.inspection.finished&&S.inspection.rack!==S.rack){let r=S.inspection.rack;S.rack=r;note("Есть незавершённая проверка полки "+r+". Сначала завершите или отмените её.","warn");render();return}if(S.inspection&&!S.inspection.finished&&S.inspection.rack===S.rack){note("Продолжайте уже начатую проверку.","warn");render();return}let id="demo-"+Date.now();S.inspection={id,rack:S.rack,finished:false,seen:[],scans:[],unresolved:[],expected:samples.filter(x=>!x.deleted&&x.loc===S.rack).map(x=>x.id),label:"Новая проверка",source:"Демонстрация"};S.inspectionScan="";note("Проверка началась. Сканируйте подряд, ничего подтверждать после каждого скана не нужно.","good");render()}
function logScan(code,kind,label){let a=S.inspection;a.scans=a.scans||[];a.scans.push({code,kind,label,time:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"})})}
function observe(x,code){let a=S.inspection;if(a.seen.includes(x.id)){logScan(code,"dup","Повтор");note("Повтор "+x.id+" не увеличивает количество.","warn");return}a.seen.push(x.id);logScan(code,"ok","Добавлен");note("Добавлен "+x.id+". Можно сканировать следующий.","good")}
function inspectAdd(code){let a=S.inspection;if(!a||a.finished)return;code=String(code||"").trim();if(!code)return;S.inspectionScan="";let x=samples.find(s=>!s.deleted&&(s.id.toLowerCase()===code.toLowerCase()||s.epc&&s.epc.toLowerCase()===code.toLowerCase()));if(x){observe(x,code);render();return}
let p=products.find(p=>p.barcode===code||p.article.toLowerCase()===code.toLowerCase());if(p){let candidates=samples.filter(x=>!x.deleted&&x.p===p.id);if(candidates.length===1){observe(candidates[0],code);render();return}
if(!candidates.length){a.unresolved.push({code,reason:"Для этого товара нет активных образцов",candidates:[]});logScan(code,"bad","Нет образца");note("Товар найден, но активных образцов нет. Сканируйте дальше.","warn");render();return}
a.unresolved.push({code,reason:"У товара "+candidates.length+" образцов. Нельзя определить экземпляр по товарному штрихкоду.",candidates:candidates.map(x=>x.id)});logScan(code,"bad","Уточнить");note("У этого товара несколько образцов. Сканируйте дальше, затем уточните экземпляр.","warn");render();return}
a.unresolved.push({code,reason:"Код не найден",candidates:[]});logScan(code,"bad","Неизвестный");note("Код не найден. Сканируйте дальше, потом удалите ошибочный скан.","warn");render()}
function resolveScan(i){let a=S.inspection,u=a?.unresolved?.[i];if(!u)return;let id=document.querySelector('[data-resolve-select="'+i+'"]')?.value;if(!id){note("Сначала выберите конкретный образец.","warn");render();return}let x=samples.find(x=>x.id===id&&!x.deleted);if(!x){note("Образец недоступен.","error");render();return}a.unresolved.splice(i,1);observe(x,u.code);render()}
function discardScan(i){let a=S.inspection;if(!a?.unresolved?.[i])return;a.unresolved.splice(i,1);note("Ошибочный скан убран из списка уточнения. Остальные наблюдения сохранены.","good");render()}
function inspectFinish(){let a=S.inspection;if(a.unresolved?.length){note("Сначала разберите "+a.unresolved.length+" сканирований, требующих уточнения.","error");render();return}a.finished=true;a.label="Демо: завершена только что";S.lastByRack[a.rack]=a;for(let x of samples){if(x.deleted)continue;if(a.seen.includes(x.id)){x.seen=a.rack;x.inspected=a.id}else if(a.expected.includes(x.id)){x.seen=null;x.inspected=a.id}}history.unshift({kind:"Проверка",desc:"Завершена проверка "+a.rack+": "+a.seen.length+" обнаружено, "+missingRows().length+" не найдено."});S.page="afterInspect";note("Проверка завершена. Учётные места не менялись.","good");render()}
function previewFix(){let ids=S.selected.filter(id=>samples.some(x=>x.id===id&&!x.deleted));if(!ids.length)return;S.preview={kind:S.action==="physical"?"physical":"move",ids,target:S.action==="here"?S.rack:S.action==="other"?S.target:null};S.page="preview";render()}
function commit(){let m=S.preview;if(!m)return;if(m.kind==="remove"&&!S.confirmDelete)return;if(S.conflict){S.conflict=false;S.page="result";S.result={heading:"Обнаружен конфликт — ничего не изменено",sub:"В одной записи изменились данные после выбора.",kind:"error",message:"Пакет отклонён целиком. Обновите список и повторите операцию. Никаких частичных изменений.",count:0,error:m.ids.length,items:m.ids};S.selected=[];render();return}
if(S.network){S.network=false;S.page="result";S.result={heading:"Связь прервалась — результат неизвестен",sub:"Нельзя автоматически считать операцию успешной или повторять её с новым номером.",kind:"warn",message:"Демо: операция не применена. В реальной программе нужно проверить статус прежнего requestId и безопасно повторить тот же запрос.",count:0,error:m.ids.length,items:m.ids};render();return}
if(m.kind==="physical"){S.result={heading:"Памятка по физическому переносу",sub:"Учётные места не изменены.",message:"Отнесите образцы на их учётные полки. Факт переноса должен быть подтверждён отдельно; эта демонстрация его не регистрирует.",count:m.ids.length,error:0,items:m.ids};history.unshift({kind:"Памятка",desc:"Показаны направления физического переноса для "+m.ids.length+" образцов; учёт не изменён."})}
else{let changed=0;for(let id of m.ids){let x=samples.find(x=>x.id===id);if(!x||x.deleted)continue;if(m.kind==="remove"){x.deleted=true;changed++}else if(x.loc!==m.target){x.loc=m.target;x.version++;changed++}}S.result={heading:m.kind==="remove"?"Образцы убраны":"Места исправлены",sub:"Операция выполнена в демонстрационных данных.",message:m.kind==="remove"?"Исключено из активного учёта: "+changed+". История сохранена.":"Изменено мест: "+changed+". Повторно сканировать не потребовалось.",count:changed,error:0,items:m.ids};history.unshift({kind:m.kind==="remove"?"Удаление":"Перемещение",desc:S.result.message})}
S.selected=[];S.preview=null;S.confirmDelete=false;S.page="result";note("","good");render()}
function bind(){document.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>act(el.dataset.a));document.querySelectorAll("[data-select]").forEach(el=>el.onchange=()=>{let id=el.dataset.select;if(el.checked){if(!S.selected.includes(id))S.selected.push(id)}else S.selected=S.selected.filter(x=>x!==id);render()});

function saveShelf(){let typed=($("rack-scan")?.value||"").trim();let id=typed?typed.replace(/^RACK:/i,"").toUpperCase():$("rack-select")?.value;if(!R.some(r=>r.id===id)){note("Такой полки нет. Проверьте код.","error");render();return}if(id!==S.rack&&queueCount()){if(!window.confirm("В очереди "+queueCount()+" образцов. При смене полки ВСЯ партия будет назначена на "+id+". Продолжить?"))return}
S.rack=id;S.selected=[];S.page=S.afterShelf||"home";S.afterShelf=null;note("Рабочая полка подтверждена: "+id,"good");render()}

function act(a){
if(a==="overview"){S.page="overview";S.flash="";render();return}
if(a==="analytics"){S.page="analytics";S.flash="";render();return}
if(a==="racks"){S.page="racks";S.flash="";render();return}
if(a.startsWith("analyt-")){S.analyticsTab=a.slice(7);if(!["no","wrong","missing","zero","all"].includes(S.analyticsTab))S.analyticsTab="no";S.analyticsSearch="";S.analyticsSelected=[];S.page="analytics";S.flash="";render();return}
if(a.startsWith("openrack-")){S.rack=a.slice(9);S.page="home";S.selected=[];S.flash="";render();return}
if(a.startsWith("checkrack-")){S.rack=a.slice(10);S.page="inspect";S.flash="";render();return}
if(a==="analytics-all"){let filtered=noSampleProducts().filter(p=>!S.analyticsSearch||[p.name,p.article,p.barcode].some(v=>v.toLowerCase().includes(S.analyticsSearch.toLowerCase())));S.analyticsSelected=filtered.map(p=>String(p.id));render();return}
if(a==="analytics-create"){let selected=noSampleProducts().filter(p=>S.analyticsSelected.includes(String(p.id)));if(!selected.length)return;if(queueCount()&&!window.confirm("Заменить текущую очередь создания?"))return;S.queue=selected.map(p=>({code:p.barcode,p:p.id,qty:1}));S.afterShelf="create";S.createStep="scan";S.shelfReturn="analytics";S.page="shelf";note("В очереди "+selected.length+" товаров без образца. Теперь обязательно подтвердите полку размещения.","good");render();return}
if(a==="back"){goBack();return}if(a==="home"){S.page="home";S.selected=[];S.flash="";render();return}if(a==="shelf"){if(S.inspection&&!S.inspection.finished&&S.inspection.rack===S.rack){note("Сначала завершите или отмените текущую проверку, прежде чем менять рабочую полку.","warn");render();return}S.shelfReturn=S.page;S.page="shelf";S.flash="";render();return}if(a==="shelf-save"){saveShelf();return}
if(a==="inspect-cancel"){if(window.confirm("Отменить текущую проверку? Все ещё не завершённые наблюдения этой проверки будут потеряны.")){S.inspection=null;S.inspectionScan="";S.page="home";note("Незавершённая проверка отменена. Учётные места не менялись.","good");render()}return}
if(a==="create-cancel"){if(window.confirm("Отменить создание партии? Очередь из "+queueCount()+" образцов будет очищена. Ничего не создано.")){S.queue=[];S.createStep="scan";S.page="home";note("Создание отменено. Образцы не создавались.","good");render()}return}
if(a==="create"){S.page="create";S.createStep="scan";S.flash="";render();return}
if(a==="add-scan"){addScan($("scan")?.value||S.scan);return}
if(a==="demo-100"){S.queue=products.slice(0,100).map(p=>({code:p.barcode,p:p.id,qty:1}));note("Добавлено 100 товаров. Можно проверить список и создать партию.","good");render();return}
if(a==="clear-queue"){if(window.confirm("Очистить всю очередь? Образцы ещё не созданы.")){S.queue=[];note("Очередь очищена.","good");render()}return}
if(a==="create-review"){if(!queueCount()||S.queue.some(x=>!x.p))return;S.createStep="review";S.flash="";render();return}
if(a==="create-back"){S.createStep="scan";render();return}
if(a==="create-confirm"){let n=queueCount();S.created=[];for(let x of S.queue)for(let i=0;i<x.qty;i++){let id="S-"+String(nextId++).padStart(6,"0");samples.push({id,p:x.p,loc:S.rack,seen:null,deleted:false,version:1,inspected:null});S.created.push(id)}S.queue=[];S.createStep="scan";S.page="result";S.result={heading:"Образцы созданы",sub:"Все новые образцы размещены на "+S.rack,message:"Создано "+n+" из "+n+" физических образцов. У каждого свой уникальный код. Данные 1С не изменялись.",count:n,error:0,items:S.created};history.unshift({kind:"Создание",desc:"Создано "+n+" образцов на "+S.rack});S.flash="";render();return}

if(a==="inspect-demo"){if(S.rack!=="B-01-02"){note("Подготовленный пример 50 чужих + 8 отсутствующих доступен для полки B-01-02. Выберите её на главном экране.","warn");render();return}let arr=samples.filter(x=>!x.deleted&&((x.id>="S-000001"&&x.id<="S-000050")||(x.id>="S-000059"&&x.id<="S-000070"))).map(x=>x.id);S.inspection.seen=Array.from(new Set(S.inspection.seen.concat(arr)));S.inspection.scans=S.inspection.scans||[];S.inspection.scans.push({code:"DEMO",kind:"ok",label:"Загружено "+arr.length,time:new Date().toLocaleTimeString("ru-RU")});note("Демо: загружены наблюдения. Можно завершить проверку.","good");render();return}

if(a==="inspect-finish"){inspectFinish();return}
if(a==="fix"){S.page="fix";S.issue="wrong";S.selected=[];S.flash="";render();return}
