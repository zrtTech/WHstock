<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Образцы тканей — макет v12</title>
<style>
:root{font:15px/1.5 system-ui,"Segoe UI",Arial,sans-serif;color:#152a48;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #b9cce5;background:white;color:#123359;border-radius:10px;padding:9px 15px;font-weight:650}button:hover{background:#eaf1ff}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#245fe8;color:white;border-color:#245fe8}.primary:hover{background:#164ac1}.danger{color:#b62239;border-color:#e4b0ba}.danger:hover{background:#fff0f2}.ghost{background:transparent}.top{background:white;border-bottom:1px solid #dbe5f2;padding:12px max(18px,calc((100vw - 1250px)/2));position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand strong{font-size:19px}.small{font-size:12px;color:#5d7190}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.nav button{min-height:40px}.nav .on{background:#e4edff;color:#174bd1;border-color:#9cbaff}.wrap{max-width:1250px;margin:0 auto;padding:20px 18px 70px}.banner{background:#edf3ff;border:1px solid #c9dbff;color:#244f94;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:15px}.sub{color:#5b7090;margin:4px 0 22px}h1{font-size:29px;line-height:1.25;margin:5px 0}h2{font-size:19px;margin:0 0 12px}h3{margin:0 0 9px}.panel{background:white;border:1px solid #d7e3f2;border-radius:15px;padding:22px;margin-bottom:15px;box-shadow:0 8px 28px #142b4709}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:17px;border:1px solid #d7e3f2;border-radius:12px;background:#f7f9fd}.metric b{display:block;font-size:28px;line-height:1.15}.metric small{color:#5e7190}.task{display:flex;gap:12px;text-align:left;align-items:center;min-height:95px;padding:17px}.task strong{display:block;font-size:17px}.task small{display:block;color:#587092;font-weight:400}.task .symbol{background:#e9f0ff;border-radius:9px;color:#2058d9;padding:8px;font-size:22px;min-width:42px;text-align:center}.rack{background:#102947;color:white;border-radius:15px;padding:20px 25px;margin-bottom:15px}.rack b{font-size:34px}.rack button{float:right}.input{border:1px solid #b8cce8;border-radius:10px;min-height:48px;padding:10px 13px;width:100%;background:white;color:#142a48}.scan{font-size:21px;min-height:58px;border:2px solid #7ea5ff}.input:focus{outline:3px solid #c5d7ff}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.notice{border:1px solid #c7d8f6;border-radius:10px;padding:13px 15px;background:#eef4ff;margin:12px 0}.good{background:#e8f8f0;border-color:#b7e8ce;color:#126748}.warn{background:#fff5e2;border-color:#f1d49a;color:#8a5400}.bad{background:#fff0f1;border-color:#eebec7;color:#a81e36}.tablewrap{overflow:auto;max-height:460px;border:1px solid #dce6f3;border-radius:11px;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:14px}th{position:sticky;top:0;background:#edf3fb;text-align:left;color:#35567e;font-size:12px;z-index:1}th,td{padding:10px 12px;border-bottom:1px solid #e2eaf5}tr:hover td{background:#f8fbff}td button{min-height:36px;padding:5px 10px}.pill{display:inline-block;border-radius:6px;padding:3px 7px;font-size:12px;background:#eef2f8}.pill.red{background:#ffe8eb;color:#b11d36}.pill.green{background:#e0f6e8;color:#117447}.pill.yellow{background:#fff0d3;color:#905b00}.footerbar{position:sticky;bottom:0;background:#fff;border:1px solid #c9dbf2;box-shadow:0 -8px 25px #142b4710;padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.spacer{flex:1}.muted{color:#5f7494}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.steps span{background:#e9eef6;border-radius:7px;padding:6px 11px;font-size:13px}.steps .current{background:#dce8ff;color:#1752ce;font-weight:700}.tabs{display:flex;flex-wrap:wrap;gap:7px}.tabs .on{background:#245fe8;color:white}.back{margin-bottom:10px}.count{font-size:28px;font-weight:750}.highlight{color:#1a58da}.check{width:19px;height:19px;accent-color:#245fe8}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:750;color:#607897}.split{display:grid;grid-template-columns:2fr 1fr;gap:15px}@media(max-width:850px){.grid4{grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}.top{position:static}}@media(max-width:530px){.grid4{grid-template-columns:1fr 1fr}.wrap{padding:12px}.panel{padding:14px}h1{font-size:24px}.rack b{font-size:26px}.nav button{padding:7px 9px;font-size:13px}}
 .qr-preview{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:16px;border:1px solid #dce6f3;border-radius:12px}.qr-print{display:none}@media print{.top{display:none!important}.wrap>*:not(.qr-print){display:none!important}.qr-print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8mm}.qr-label{border:1px solid black;padding:4mm;display:flex;flex-direction:column;align-items:center;gap:2mm;break-inside:avoid}.qr-label svg{width:38mm;height:38mm}}.rack-rows{max-width:510px;display:grid;gap:8px;margin:12px 0}.rack-row{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#f2f6fd;border:1px solid #b7cde9;padding:14px}.rack-row strong{font-size:17px}.rack-row small{font-size:12px;color:#587092}.caution{background:#fff6e8;border:1px solid #e9cf9b;border-radius:10px;padding:14px;margin:12px 0}</style></head><body><div id="app"></div>
<script>
(function(){
"use strict";
var KEY="fabric-prototype-v12";
var R=Array.from({length:8},function(_,i){return ["L","R"].flatMap(function(side){return [1,2,3,4].map(function(row){return{id:String(i+1)+side+row,name:"Стеллаж "+(i+1)+" · "+(side==="L"?"левая":"правая")+" сторона · ряд "+row+" (сверху вниз)"}})})}).flat();
var names=["Лён натуральный","Блэкаут графит","Велюр песочный","Сатин белый","Рогожка серая","Шенилл оливковый","Хлопок экрю","Жаккард синий","Тюль молочный","Габардин бежевый"];
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function id(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function seed(){
var products=Array.from({length:140},function(_,i){return{id:i+1,article:"ART-"+String(i+1).padStart(4,"0"),barcode:"460000"+String(i+1).padStart(7,"0"),name:names[i%names.length]+" / "+String(i+1).padStart(3,"0"),stock:i%7===0?0:i%11===0?0.4:i%13===0?0.8:i%29+1}});
var samples=Array.from({length:80},function(_,i){var n=i+1,pid=i<55?i+1:i-54,loc=R[i%64].id;return{id:"S-"+String(n).padStart(6,"0"),pid:pid,loc:loc,epc:i<65?"E200"+String(n).padStart(20,"0"):null,active:true,version:1,createdAt:now()}});
var expected=samples.filter(function(x){return x.loc==="1L1"}).map(function(x){return x.id});
var seen=[expected[0],samples[1].id],observations={};seen.forEach(function(sid){observations[sid]={count:3,lastAt:now(),firstAt:now(),rssiLast:-62,source:"Демо C5"}});
return{schema:12,products:products,samples:samples,next:81,queue:[],rack:"1L1",sessions:[{id:"initial",rack:"1L1",status:"done",expected:expected,seen:seen,observations:observations,review:{},unclear:[],startedAt:now(),finishedAt:now()}],events:[],lastCreated:[],c5Inbox:{},c5InventoryInbox:{},c5Errors:[],lowStockThreshold:0.5};
}
var db;try{db=JSON.parse(localStorage.getItem(KEY)||"null");if(!db||db.schema!==12)db=seed()}catch(e){db=seed()}
if(!db.c5Inbox)db.c5Inbox={};if(!db.c5InventoryInbox)db.c5InventoryInbox={};if(!db.c5Errors)db.c5Errors=[];if(db.lowStockThreshold==null)db.lowStockThreshold=0.5;
var ui={page:"warehouse",stack:[],notice:"",search:"",selected:[],filter:"wrong",report:"no",target:"",epcPid:null,epcSample:null,qrRack:"1L1",qrCount:1,session:null,detail:null,after:"work",rackNo:1,rackSide:"L",warehouseRack:1};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){ui.notice="Не удалось сохранить данные браузера. Экспортируйте их вручную."}}
function product(pid){return db.products.find(function(x){return x.id===pid})}
function sample(sid){return db.samples.find(function(x){return x.id===sid})}
function active(){return db.samples.filter(function(x){return x.active})}
function byProduct(pid){return active().filter(function(x){return x.pid===pid})}
function lookup(v){v=String(v||"").trim().toLowerCase();return db.products.find(function(p){return p.article.toLowerCase()===v||p.barcode===v})}
function latest(r){return db.sessions.filter(function(s){return s.rack===r&&s.status==="done"}).slice(-1)[0]}
function running(){return db.sessions.find(function(s){return s.status==="active"})}
function issues(r,type){var s=latest(r);if(!s)return[];var review=s.review||{};if(type==="wrong")return s.seen.filter(function(sid){var z=sample(sid),state=review[sid]&&review[sid].state;return z&&z.active&&z.loc!==r&&state!=="spillover"&&state!=="returned"});return s.expected.filter(function(sid){var z=sample(sid),state=review[sid]&&review[sid].state;return z&&z.active&&z.loc===r&&!s.seen.includes(sid)&&state!=="found_here"})}
function totalIssues(type){return R.reduce(function(n,r){return n+issues(r.id,type).length},0)}
function log(action,ids,detail){db.events.push({id:id(),at:now(),action:action,ids:ids,detail:detail});save()}
function b(label,act,cls,disabled){return'<button type="button" data-a="'+esc(act)+'" class="'+(cls||"")+'" '+(disabled?"disabled":"")+'>'+esc(label)+'</button>'}
function pill(text,color){return'<span class="pill '+(color||"")+'">'+esc(text)+'</span>'}
function table(headers,rows){return'<div class="tablewrap"><table><thead><tr>'+headers.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}
function tr(cells){return'<tr>'+cells.map(function(x){return'<td>'+x+'</td>'}).join("")+'</tr>'}
function field(id,label,placeholder,value,scan){return'<div class="field"><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" class="input '+(scan?"scan":"")+'" autocomplete="off" spellcheck="false" placeholder="'+esc(placeholder)+'" value="'+esc(value||"")+'"></div>'}
function head(t,sub){return'<div class="tag">УЧЁТ ФИЗИЧЕСКИХ ОБРАЗЦОВ</div><h1>'+esc(t)+'</h1><p class="sub">'+esc(sub)+'</p>'}
function rackBanner(){return'<div class="rack">'+b("Сменить полку","shelf","")+'<div class="tag" style="color:#a9c5e8">РАБОЧАЯ ПОЛКА</div><b>'+esc(db.rack)+'</b><div>'+esc(R.find(function(x){return x.id===db.rack}).name)+'</div></div>'}
function nav(){var pages=[["warehouse","Склад"],["work","Работа на полке"],["find","Найти товар"],["reports","Аналитика"],["history","Журнал"],["system","Система"]];return'<header class="top"><div class="brand"><div><strong>▤ Образцы тканей</strong><div class="small">Артикул для человека · EPC для системы</div></div><span class="small">ДЕМО · без 1С и C5</span></div><nav class="nav">'+pages.map(function(p){return b(p[1],"nav:"+p[0],ui.page===p[0]?"on":"")}).join("")+'</nav></header>'}
function frame(body){document.getElementById("app").innerHTML=nav()+'<main class="wrap"><div class="banner">ИНТЕРАКТИВНЫЙ МАКЕТ v12 · Данные вымышлены · Реальные 1С, Chainway C5 и RFID SDK не подключены.</div>'+(ui.stack.length?'<div class="back">'+b("← Назад","back","ghost")+'</div>':"")+(ui.notice?'<div class="notice good">'+esc(ui.notice)+'</div>':"")+body+'</main>';wire()}
function go(p){if(ui.page!==p)ui.stack.push(ui.page);ui.page=p;ui.notice="";render()}
function back(){ui.page=ui.stack.pop()||"warehouse";ui.notice="";render()}
function countNo(){return db.products.filter(function(p){return !byProduct(p.id).length}).length}
function warehouse(){var list=R.filter(function(r){return Number(r.id[0])===ui.warehouseRack});frame(head("Весь склад","8 стеллажей × 2 стороны (L/R) × 4 ряда сверху вниз = 64 адреса. Скан RFID не доказывает местонахождение.")+
'<div class="grid4"><div class="metric"><b>'+active().length+'</b><small>Активных экземпляров</small></div><div class="metric"><b>'+countNo()+'</b><small>Товаров без образца</small></div><div class="metric"><b>'+totalIssues("wrong")+'</b><small>Чужих радиосигналов к проверке</small></div><div class="metric"><b>'+totalIssues("missing")+'</b><small>Не считаны, требуют поиска</small></div></div>'+
'<section class="panel" style="margin-top:15px"><div class="row between"><h2>Места хранения · стеллаж '+ui.warehouseRack+'</h2>'+b("Начать работу","nav:work","primary")+'</div>'+
'<div class="row" style="margin-bottom:12px">'+Array.from({length:8},function(_,i){return b("Стеллаж "+(i+1),"whRack:"+(i+1),ui.warehouseRack===i+1?"primary":"")}).join("")+'</div>'+
table(["Адрес","Числится","Последняя проверка","Сигналы с других адресов","Не считаны","Действие"],list.map(function(r){var x=latest(r.id);return tr(['<b>'+r.id+'</b><br><small>'+esc(r.name)+'</small>',String(active().filter(function(s){return s.loc===r.id}).length),x?new Date(x.finishedAt).toLocaleString("ru-RU"):"Не проверялся",x?String(issues(r.id,"wrong").length):"—",x?String(issues(r.id,"missing").length):"—",b("Работать","rack:"+r.id,"primary")+" "+b("Проверить","check:"+r.id)])}))+
'<div class="notice">Чужие радиосигналы могут приходить из соседних рядов. Ни один результат считывания сам по себе не изменяет адрес образца.</div></section>'+
'<div class="row">'+b("Товары без образцов","report:no")+b("Кандидаты по остаткам 1С","report:low")+b("Все расхождения","report:wrong")+'</div>')}
function work(){var s=latest(db.rack);frame(rackBanner()+head("Что нужно сделать?","Выберите одну задачу. После операции вернитесь сюда.")+
'<div class="grid">'+
'<button class="task" data-a="create"><span class="symbol">＋</span><span><strong>Добавить образцы</strong><small>Сканировать 10–100 товарных ШК подряд, создать экземпляры на этой полке</small></span></button>'+
'<button class="task" data-a="inspection"><span class="symbol">▣</span><span><strong>Проверить полку</strong><small>Считывать EPC подряд, сравнить фактические и учётные места</small></span></button>'+
'<button class="task" data-a="issues"><span class="symbol">↔</span><span><strong>Исправить места</strong><small>Разобрать чужие и не найденные образцы</small></span></button>'+
'<button class="task" data-a="rfid"><span class="symbol">◉</span><span><strong>RFID с C5</strong><small>Просмотр полученных данных и ожидания синхронизации</small></span></button></div><div class="row" style="margin-top:12px">'+b("Печать QR места","qr","ghost")+'<small class="muted">Необязательная наклейка с адресом полки</small></div>'+
'<section class="panel" style="margin-top:15px"><h2>Последняя проверка этой полки</h2>'+(s?'<div class="grid4"><div class="metric"><b>'+s.seen.length+'</b><small>Уникальных сканов</small></div><div class="metric"><b>'+issues(db.rack,"wrong").length+'</b><small>Чужие</small></div><div class="metric"><b>'+issues(db.rack,"missing").length+'</b><small>Не найдены</small></div><div class="metric"><b>'+active().filter(function(x){return x.loc===db.rack&&!x.epc}).length+'</b><small>Без EPC</small></div></div>':'<div class="notice">Полка ещё не проверялась.</div>')+
'<div class="row" style="margin-top:15px">'+b("Найти товар по артикулу","nav:find")+b("Убрать образцы из учёта","remove","danger")+b("Весь склад","nav:warehouse")+'</div></section>')}
function shelf(){var r=ui.rackNo,side=ui.rackSide;frame(head("Выберите рабочее место","Адрес: номер стеллажа 1–8, сторона L/R и ряд 1–4 сверху вниз. Например, 1L1.")+
'<section class="panel">'+field("rackscan","Сканируйте QR места + Enter","RACK:1L1","",true)+
'<h2>1. Стеллаж</h2><div class="row">'+Array.from({length:8},function(_,i){return b(String(i+1),"pickrack:"+(i+1),r===i+1?"primary":"")}).join("")+'</div>'+
'<h2 style="margin-top:16px">2. Сторона</h2><div class="row">'+b("L · левая","pickside:L",side==="L"?"primary":"")+b("R · правая","pickside:R",side==="R"?"primary":"")+'</div>'+
'<h2 style="margin-top:16px">3. Ряд (сверху вниз)</h2><div class="rack-rows">'+[1,2,3,4].map(function(n){var code=String(r)+side+n,cnt=active().filter(function(x){return x.loc===code}).length;return'<button class="rack-row" data-a="setrack:'+code+'"><strong>Ряд '+n+' · '+code+'</strong><small>'+cnt+' образцов в учёте · выбрать</small></button>'}).join("")+'</div>'+
'<p class="small">QR наклеивается на стационарный адрес ряда. RFID-считывание соседнего ряда не является подтверждением нахождения образца здесь.</p></section>')}
function create(){var qty=db.queue.reduce(function(n,q){return n+q.qty},0),bad=db.queue.some(function(q){return !q.pid});frame(rackBanner()+head("Добавить образцы","Сканируйте товарный штрихкод или введите артикул и Enter. Каждый скан добавляется автоматически.")+
'<div class="steps"><span class="current">1. Сканировать товары</span><span>2. Проверить количество</span><span>3. Создать на полке</span></div>'+
'<section class="panel"><div class="row between"><h2>Товары в партии</h2><div class="count">'+qty+' шт.</div></div>'+
field("createscan","Товарный ШК / артикул + Enter","4600000000001 или ART-0001","",true)+
'<div class="notice">Один товарный ШК может встречаться несколько раз: это будут разные физические образцы одного артикула. Новые этикетки печатать не нужно.</div>'+
'<div class="row">'+b("Демо: добавить 100 товаров","demo100")+b("Очистить список","clearqueue","",!qty)+b("Отменить","cancelcreate")+'</div>'+
table(["Артикул","Товар","Количество","Действие"],db.queue.map(function(q,i){var p=product(q.pid);return tr(['<b>'+esc(p?p.article:q.code)+'</b>',esc(p?p.name:"Код не найден"),b("−","dec:"+i)+" <b>"+q.qty+"</b> "+b("+","inc:"+i),b("Убрать","del:"+i)])}))+
'<div class="footerbar"><b>На полку '+esc(db.rack)+' · '+qty+' образцов</b><span class="spacer"></span>'+b("Создать "+qty+" образцов","commitcreate","primary",!qty||bad)+'</div></section>')}
function created(){var list=db.lastCreated.map(sample).filter(Boolean),map={};list.forEach(function(s){var p=product(s.pid);if(!map[s.pid])map[s.pid]={p:p,n:0};map[s.pid].n++});frame(rackBanner()+head("Партия создана","Записи образцов созданы и связаны с товарами по артикулам. Печать этикеток не требуется.")+
'<section class="panel"><div class="grid4"><div class="metric"><b>'+list.length+'</b><small>Создано экземпляров</small></div><div class="metric"><b>'+Object.keys(map).length+'</b><small>Артикулов</small></div><div class="metric"><b>'+list.filter(function(x){return !x.epc}).length+'</b><small>Пока без EPC</small></div><div class="metric"><b>'+esc(db.rack)+'</b><small>Учётная полка</small></div></div>'+
'<div class="notice good">Образцы уже существуют в демосправочнике. RFID записывается и связывается с товаром на C5. Windows получает готовые данные.</div>'+
table(["Артикул","Товар","Новых образцов"],Object.keys(map).map(function(k){var x=map[k];return tr([esc(x.p.article),esc(x.p.name),String(x.n)])}))+
'<div class="row" style="margin-top:15px">'+b("Состояние RFID","rfid","primary")+b("Добавить ещё","create")+b("Вернуться к работе","nav:work")+'</div></section>')}
function find(){var q=ui.search.trim().toLowerCase(),products=db.products.filter(function(p){return !q||[p.article,p.name,p.barcode].some(function(v){return v.toLowerCase().includes(q)})});frame(head("Найти товар","Поиск по артикулу, названию или общему товарному ШК. У одного товара может быть несколько образцов.")+
