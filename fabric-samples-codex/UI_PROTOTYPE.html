<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Образцы тканей — интерактивный макет</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#152335;--muted:#64748b;--line:#e2e8f0;--blue:#2463eb;--blueSoft:#eaf1ff;--green:#13855c;--greenSoft:#e9f8f1;--red:#c83f4b;--redSoft:#fff0f1;--amber:#a86c13;--amberSoft:#fff6e5;--nav:#142238;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--nav);color:#e5edf9;display:flex;flex-direction:column;padding:23px 15px;gap:10px}
.brand{display:flex;align-items:center;gap:12px;padding:3px 11px 26px;border-bottom:1px solid #30415a;margin-bottom:14px}.brand-icon{width:39px;height:39px;border-radius:11px;background:#3b82f6;display:grid;place-items:center;font-size:22px}.brand strong{font-size:17px;display:block}.brand small{color:#93a6c2;font-size:11px}
.nav{border:0;background:transparent;color:#c2d0e2;display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:11px;text-align:left;font-weight:600;width:100%}.nav:hover{background:#253851}.nav.active{background:#31527e;color:white}.nav .symbol{width:22px;text-align:center;font-size:18px}
.side-bottom{margin-top:auto;border-top:1px solid #30415a;padding:20px 10px 5px;color:#a6b6cd;font-size:12px}.side-bottom strong{color:#e5edf9}
.main{padding:30px clamp(20px,3vw,48px);max-width:1650px;width:100%;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:23px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:#64748b;margin-bottom:5px}.top h1{font-size:29px;letter-spacing:-.04em;line-height:1.2;margin:0 0 6px}.subtitle{color:var(--muted);margin:0}.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;color:#4b5b70;font-weight:600;font-size:12px}.dot{height:8px;width:8px;background:#16a66a;border-radius:50%}.dot.orange{background:#f59e0b}
.grid{display:grid;grid-template-columns:1.28fr .72fr;gap:18px}.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 5px 20px #15233508;padding:23px}.card h2{font-size:17px;margin:0 0 5px;letter-spacing:-.015em}.card .hint{color:var(--muted);font-size:13px;margin:0 0 20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.label{display:block;font-size:12px;font-weight:700;color:#55657b;margin:0 0 7px}.field{width:100%;border:1px solid #cfd8e5;background:#fff;border-radius:10px;padding:12px 13px;outline:0;color:var(--ink);min-height:45px}.field:focus{border-color:#4584f8;box-shadow:0 0 0 3px #dbeafe}.field.big{padding:17px 17px 17px 46px;font-size:17px;font-weight:600;min-height:58px}.scan-wrap{position:relative}.scan-wrap:before{content:"▦";position:absolute;left:16px;top:13px;color:#2b66e8;font-size:25px}.button{border:1px solid transparent;border-radius:10px;padding:11px 15px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--blue);color:white}.primary:hover{background:#164fce}.outline{background:white;border-color:#cbd5e1;color:#26374c}.outline:hover{background:#f5f8fc}.danger{background:#fff;border-color:#f0b9bf;color:var(--red)}.danger:hover{background:#fff1f2}.green{background:var(--green);color:white}.green:hover{background:#096947}.textbtn{border:0;background:transparent;color:var(--blue);font-weight:700;padding:8px}
.tag{font-size:11px;letter-spacing:.02em;font-weight:800;padding:5px 9px;border-radius:7px;display:inline-block}.tag.blue{color:#215bd3;background:var(--blueSoft)}.tag.green{color:#0e8154;background:var(--greenSoft)}.tag.red{color:#ba3443;background:var(--redSoft)}.tag.amber{color:#996214;background:var(--amberSoft)}.tag.gray{color:#637389;background:#eef2f6}
.divider{height:1px;background:var(--line);margin:20px 0}.item-title{font-size:22px;letter-spacing:-.03em;font-weight:800;margin:7px 0}.muted{color:var(--muted)}.small{font-size:12px}.metric{background:#f7f9fc;border-radius:11px;padding:15px 17px;flex:1;min-width:100px}.metric b{display:block;font-size:25px;line-height:1.2}.metric span{color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:9px 0}.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:650}
.notice{border:1px solid #f3d6a6;background:var(--amberSoft);padding:14px 16px;border-radius:10px;color:#83540f;margin:16px 0}.notice.green{border-color:#bce8d3;background:var(--greenSoft);color:#126444}.notice.red{border-color:#f3b7be;background:var(--redSoft);color:#aa3441}.empty{padding:38px 15px;text-align:center;border:1px dashed #d2dce8;border-radius:12px;color:#6c7c90}.empty .symbol{font-size:36px;margin-bottom:8px}
.location{border:1px solid #cbdcfb;background:#f3f7ff;border-radius:12px;padding:18px}.location strong{font-size:23px;letter-spacing:-.03em}.location small{display:block;color:#64748b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}.item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item-row:last-child{border-bottom:0}.item-row b{display:block}.item-row small{color:var(--muted)}.mini-btn{padding:7px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#215bd3;font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.form-grid .wide{grid-column:1/-1}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#708095;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.table-wrap{overflow-x:auto}
.modal-back{position:fixed;inset:0;background:#101d32a6;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(470px,100%);background:white;border-radius:17px;padding:26px;box-shadow:0 24px 80px #0004}.modal h2{margin:0 0 9px;font-size:21px}.modal p{color:#5c6a7d}.modal .actions{justify-content:flex-end}
.demo{background:#eef3ff;border:1px solid #d6e4ff;border-radius:9px;color:#3d5d96;padding:10px 13px;margin-bottom:20px;font-size:12px}
.footer{margin-top:24px;color:#8694a5;font-size:11px;text-align:center}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.sidebar{width:70px;padding:20px 8px}.shell{grid-template-columns:70px 1fr}.brand{justify-content:center;padding:0 0 20px}.brand span:not(.brand-icon),.nav span:not(.symbol),.side-bottom{display:none}.nav{justify-content:center;padding:13px 0}.main{padding:24px}}
@media(max-width:650px){.main{padding:16px}.top{flex-direction:column}.top h1{font-size:24px}.card{padding:17px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:1}.kv{grid-template-columns:95px 1fr}.button{width:100%}.actions .button{width:auto}.metric{min-width:95px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
"use strict";
var racks=[{id:"A-02-03",name:"Стеллаж A · секция 02 · полка 03"},{id:"B-01-02",name:"Стеллаж B · секция 01 · полка 02"},{id:"C-01-04",name:"Стеллаж C · секция 01 · полка 04"}];
var products=[{id:"LIN-205",name:"Лён плотный натуральный",article:"LIN-205",barcode:"4601234567890"},{id:"BLK-118",name:"Блэкаут графит",article:"BLK-118",barcode:"4601234567891"},{id:"VEL-072",name:"Велюр песочный",article:"VEL-072",barcode:"4601234567892"},{id:"SAT-016",name:"Сатин белый",article:"SAT-016",barcode:"4601234567893"}];
var samples=[
{id:"S-000124",p:"LIN-205",loc:"A-02-03",epc:"E280117000000124",deleted:false,v:1},
{id:"S-000125",p:"LIN-205",loc:"B-01-02",epc:"E280117000000125",deleted:false,v:1},
{id:"S-000087",p:"BLK-118",loc:"A-02-03",epc:"E280117000000087",deleted:false,v:1},
{id:"S-000198",p:"VEL-072",loc:"C-01-04",epc:"E280117000000198",deleted:false,v:1},
{id:"S-000061",p:"SAT-016",loc:"A-02-03",epc:"E280117000000061",deleted:false,v:1}
];
var history=[
{kind:"Создание",id:"S-000124",desc:"Лён плотный натуральный · A-02-03",time:"Сегодня, 09:14"},
{kind:"Перемещение",id:"S-000125",desc:"A-02-03 → B-01-02",time:"Сегодня, 09:26"},
{kind:"Создание",id:"S-000198",desc:"Велюр песочный · C-01-04",time:"Вчера, 16:40"}
];
var st={screen:"search",rack:"B-01-02",found:null,matches:[],message:"",messageType:"",scan:"",inspection:null,modal:null,newProduct:"LIN-205",newRack:"B-01-02",newEpc:"",next:200};
var app=document.getElementById("app");
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function product(id){return products.find(function(p){return p.id===id})||{name:"Неизвестный товар",article:"—"}}
function rack(id){return racks.find(function(r){return r.id===id})||{id:id,name:"Неизвестное место"}}
function options(items,value,key,label){return items.map(function(x){return '<option value="'+esc(x[key])+'" '+(x[key]===value?"selected":"")+'>'+esc(x[label])+'</option>'}).join("")}
function button(label,act,style,disabled){return '<button class="button '+(style||"outline")+'" data-action="'+act+'" '+(disabled?"disabled":"")+'>'+label+'</button>'}
function top(title,desc){return '<header class="top"><div><div class="eyebrow">Учёт физических образцов</div><h1>'+title+'</h1><p class="subtitle">'+desc+'</p></div><div class="top-right"><span class="pill"><span class="dot"></span>Локальный сервер · демо</span><span class="pill">Оператор</span></div></header>'}
function frame(content){var nav=[["search","▦","Поиск и операции"],["create","＋","Создать образец"],["inspection","◫","Проверка места"],["history","◷","История"],["settings","⚙","Настройки"]];app.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-icon">▤</span><span><strong>Образцы</strong><small>Учёт тканей</small></span></div>'+nav.map(function(n){return '<button class="nav '+(st.screen===n[0]?"active":"")+'" data-nav="'+n[0]+'"><span class="symbol">'+n[1]+'</span><span>'+n[2]+'</span></button>'}).join("")+'<div class="side-bottom"><strong>ИНТЕРАКТИВНЫЙ МАКЕТ</strong><p>Данные вымышлены. Никаких записей в 1С или на сервер.</p></div></aside><main class="main"><div class="demo">ДЕМОНСТРАЦИЯ ДИЗАЙНА · Кнопки работают только в этом макете · После обновления страницы данные сбрасываются</div>'+content+'<div class="footer">Прототип интерфейса для согласования перед разработкой · 2026</div></main></div>'+ (st.modal?modal():"");bind()}
function message(){return st.message?'<div class="notice '+st.messageType+'">'+esc(st.message)+'</div>':""}
function locationCard(){return '<div class="card"><h2>Текущее место работы</h2><p class="hint">Сканирование не перемещает образцы автоматически</p><div class="location"><small>ВЫБРАННАЯ СТОЙКА / ПОЛКА</small><strong>'+esc(st.rack)+'</strong><small>'+esc(rack(st.rack).name)+'</small></div><div style="margin-top:16px"><label class="label" for="rack-select">Изменить место</label><select class="field" id="rack-select">'+options(racks,st.rack,"id","name")+'</select></div><p class="small muted">Можно также сканировать код места, например <b>RACK:A-02-03</b>.</p></div>'}
function searchView(){var active=samples.filter(function(s){return !s.deleted});var content=top("Поиск и операции","Сканируйте образец, RFID или товарный штрихкод. Все действия — на одном экране.")+'<div class="grid"><div class="stack"><section class="card"><h2>Сканирование</h2><p class="hint">Для проверки макета попробуйте S-000124, 4601234567890 или E280117000000087</p><div class="scan-wrap"><input id="scan" class="field big" placeholder="Штрихкод образца / EPC / товарный ШК" value="'+esc(st.scan)+'" autocomplete="off"></div><div class="actions">'+button("Найти","scan","primary")+button("Пример: чужая полка","example-wrong")+button("Пример: два образца","example-many")+'</div>'+message()+'</section><section class="card"><h2>Карточка образца</h2><p class="hint">Выбранный образец остаётся на экране до следующего сканирования</p>'+sampleDetail()+'</section></div><div class="stack">'+locationCard()+'<section class="card"><h2>На выбранной полке</h2><p class="hint">По учётным данным</p>'+active.filter(function(s){return s.loc===st.rack}).map(function(s){return '<div class="item-row"><div><b>'+esc(s.id)+'</b><small>'+esc(product(s.p).name)+'</small></div><button class="mini-btn" data-open="'+esc(s.id)+'">Открыть</button></div>'}).join("")+'</section></div></div>';frame(content);var inp=document.getElementById("scan");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
function sampleDetail(){if(st.matches.length){return '<div class="notice">Товарный штрихкод относится к '+st.matches.length+' образцам. Выберите конкретный экземпляр.</div>'+st.matches.map(function(s){return '<div class="item-row"><div><b>'+esc(s.id)+' · '+esc(product(s.p).name)+'</b><small>Место: '+esc(s.loc)+'</small></div><button class="mini-btn" data-open="'+esc(s.id)+'">Выбрать</button></div>'}).join("")}
if(!st.found){return '<div class="empty"><div class="symbol">▤</div><b>Образец пока не выбран</b><p>Отсканируйте код, чтобы увидеть карточку и доступные действия.</p></div>'}
var s=samples.find(function(x){return x.id===st.found});if(!s){return '<div class="empty">Образец не найден</div>'}
var p=product(s.p),wrong=s.loc!==st.rack;return '<div class="row between"><span class="tag '+(s.deleted?"red":"green")+'">'+(s.deleted?"УДАЛЁН":"АКТИВЕН")+'</span><span class="small muted">Версия '+s.v+'</span></div><div class="item-title">'+esc(s.id)+'</div><div style="font-size:16px;font-weight:700">'+esc(p.name)+'</div><p class="muted" style="margin:3px 0 18px">Артикул '+esc(p.article)+'</p><div class="kv"><span>Учётное место</span><span>'+esc(s.loc)+'</span></div><div class="kv"><span>Выбранное место</span><span>'+esc(st.rack)+'</span></div><div class="kv"><span>RFID EPC</span><span style="overflow-wrap:anywhere">'+esc(s.epc||"Не назначен")+'</span></div>'+(s.deleted?'<div class="notice red">Образец окончательно удалён из активного учёта. История сохранена.</div>':wrong?'<div class="notice">Образец числится на другой полке. Сканирование не изменило его место.</div>':'<div class="notice green">Образец числится на выбранной полке.</div>')+(s.deleted?"":'<div class="actions">'+button(wrong?"Переместить сюда → "+esc(st.rack):"Уже на этой полке","move","primary",!wrong)+button("Удалить образец","delete","danger")+'</div>')}
function createView(){frame(top("Создать образец","Каждый физический экземпляр получает собственный код, даже если товар один.")+'<div class="grid"><section class="card"><h2>Новый физический образец</h2><p class="hint">Выберите товар из каталога 1С и место хранения</p><div class="form-grid"><div class="wide"><label class="label">Номенклатура из 1С</label><select class="field" id="new-product">'+options(products,st.newProduct,"id","name")+'</select></div><div><label class="label">Место хранения</label><select class="field" id="new-rack">'+options(racks,st.newRack,"id","name")+'</select></div><div><label class="label">RFID EPC (необязательно)</label><input class="field" id="new-epc" placeholder="Например, E280..." value="'+esc(st.newEpc)+'"></div></div><div class="notice green">Уникальный код образца будет присвоен автоматически. Это не товарный штрихкод 1С.</div><div class="actions">'+button("＋ Создать образец","create","primary")+'</div>'+message()+'</section><div class="stack"><section class="card"><h2>Что произойдёт</h2><p>1. Появится новый физический образец с уникальным кодом.</p><p>2. Он будет закреплён за выбранной полкой.</p><p>3. Создание попадёт в журнал событий.</p><p>4. Товар и остатки в 1С не изменятся.</p></section><section class="card"><h2>Этикетка</h2><div class="empty"><div style="font-size:36px;letter-spacing:3px;color:#152335">▥▥▥▥</div><b>S-000200</b><p>Пример этикетки. Принтер пока не выбран.</p></div></section></div></div>')}
function inspectionView(){var ins=st.inspection;var expected=ins?ins.expected:[];var found=ins?ins.seen.filter(function(id){return expected.indexOf(id)>=0}):[];var foreign=ins?ins.seen.filter(function(id){return expected.indexOf(id)<0}):[];var missing=expected.filter(function(id){return found.indexOf(id)<0});frame(top("Проверка места","Снимок ожидаемых образцов фиксируется при начале проверки. Ничего не удаляется автоматически.")+'<div class="grid"><div class="stack"><section class="card"><div class="row between"><div><h2>Проверка полки '+esc(ins?ins.rack:st.rack)+'</h2><p class="hint">Сканируйте образцы или RFID-метки</p></div><span class="tag '+(ins?(ins.finished?"gray":"green"):"blue")+'">'+(ins?(ins.finished?"ЗАВЕРШЕНА":"ИДЁТ ПРОВЕРКА"):"НЕ НАЧАТА")+'</span></div>'+(ins?'<div class="row"><div class="metric"><b>'+expected.length+'</b><span>Ожидалось</span></div><div class="metric"><b>'+found.length+'</b><span>Найдено</span></div><div class="metric"><b>'+missing.length+'</b><span>Не найдено</span></div><div class="metric"><b>'+foreign.length+'</b><span>Чужие</span></div></div><div class="divider"></div><div class="scan-wrap"><input class="field big" id="inspect-scan" placeholder="Код образца или EPC" '+(ins.finished?"disabled":"")+'></div><div class="actions">'+button("Зафиксировать наблюдение","observe","primary",ins.finished)+button("Завершить проверку","finish","outline",ins.finished)+'</div>':button("Начать проверку полки","start-inspection","primary"))+message()+'</section>'+(ins?'<section class="card"><h2>Результаты</h2><p class="hint">Обнаружение чужого образца — не перемещение</p><h3 style="font-size:14px">Найдено на месте</h3>'+(found.length?found.map(function(id){return '<div class="item-row"><b>'+esc(id)+'</b><span class="tag green">НАЙДЕН</span></div>'}).join(""):'<p class="muted">Пока нет</p>')+'<h3 style="font-size:14px;margin-top:18px">Чужие образцы</h3>'+(foreign.length?foreign.map(function(id){var s=samples.find(function(x){return x.id===id});return '<div class="item-row"><div><b>'+esc(id)+'</b><small>Учётное место: '+esc(s?s.loc:"неизвестно")+'</small></div><button class="mini-btn" data-open="'+esc(id)+'">Открыть</button></div>'}).join(""):'<p class="muted">Пока нет</p>')+'<h3 style="font-size:14px;margin-top:18px">Не найдены</h3>'+(missing.length?missing.map(function(id){return '<div class="item-row"><b>'+esc(id)+'</b><span class="tag amber">НЕ НАЙДЕН</span></div>'}).join(""):'<p class="muted">Нет</p>')+'</section>':"")+'</div><div class="stack">'+locationCard()+'<section class="card"><h2>Правила проверки</h2><p>Найденный образец отмечается только в текущей проверке.</p><p>Не найденный образец <b>не удаляется</b>.</p><p>Чужой образец <b>не перемещается</b> без отдельного нажатия.</p><p>Список ожидаемых образцов остаётся неизменным до завершения.</p></section></div></div>');var inp=document.getElementById("inspect-scan");if(inp)inp.focus()}
function historyView(){frame(top("История операций","Неизменяемый журнал создания, перемещения и удаления образцов.")+'<section class="card"><div class="row between"><h2>Последние события</h2><span class="tag gray">ДЕМОНСТРАЦИЯ</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Когда</th><th>Действие</th><th>Образец</th><th>Детали</th></tr></thead><tbody>'+history.map(function(x){return '<tr><td>'+esc(x.time)+'</td><td><span class="tag '+(x.kind==="Удаление"?"red":x.kind==="Создание"?"green":"blue")+'">'+esc(x.kind)+'</span></td><td><b>'+esc(x.id)+'</b></td><td>'+esc(x.desc)+'</td></tr>'}).join("")+'</tbody></table></div></section>')}
function settingsView(){frame(top("Настройки и подключения","Экран статуса интеграций. В макете подключения не выполняются.")+'<div class="grid"><section class="card"><h2>Интеграции</h2><div class="item-row"><div><b>1С:УНФ 3.0.14.123</b><small>Только чтение каталога товаров · реальный адрес не настроен</small></div><span class="tag amber">ДЕМО</span></div><div class="item-row"><div><b>SQL Server 2022</b><small>Отдельная база образцов · макет использует память браузера</small></div><span class="tag amber">ДЕМО</span></div><div class="item-row"><div><b>Chainway C5 · UHF RFID / 2D</b><small>Потребуется отдельная проверка SDK и APK</small></div><span class="tag amber">НЕ ПОДКЛЮЧЁН</span></div><div class="item-row"><div><b>USB-сканер</b><small>В этом макете можно вводить код вручную и нажимать Enter</small></div><span class="tag blue">ЭМУЛЯЦИЯ</span></div></section><section class="card"><h2>Важно перед разработкой</h2><p>Нужно уточнить модель принтера этикеток, режим USB-сканера, доступ к 1С, число операторов и сценарий C5.</p><div class="notice">Макет нужен для проверки логики экранов, а не для оценки скорости или аппаратной совместимости.</div>'+button("Сбросить демоданные","reset","outline")+'</section></div>')}
function modal(){var s=samples.find(function(x){return x.id===st.modal});if(!s)return "";return '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true"><span class="tag red">НЕОБРАТИМОЕ ДЕЙСТВИЕ</span><h2>Удалить образец '+esc(s.id)+'?</h2><p>'+esc(product(s.p).name)+' · учётное место '+esc(s.loc)+'. Образец исчезнет из активного учёта. Восстановления нет, история останется.</p><div class="actions">'+button("Отмена","cancel","outline")+button("Да, удалить навсегда","confirm-delete","danger")+'</div></div></div>'}
function render(){if(st.screen==="search")searchView();else if(st.screen==="create")createView();else if(st.screen==="inspection")inspectionView();else if(st.screen==="history")historyView();else settingsView()}
function lookup(code){code=(code||"").trim();st.scan=code;st.found=null;st.matches=[];st.message="";st.messageType="";if(!code){st.message="Введите или отсканируйте код.";st.messageType="red";render();return}
if(code.toUpperCase().indexOf("RACK:")===0){var id=code.slice(5).toUpperCase();if(racks.some(function(r){return r.id===id})){st.rack=id;st.message="Выбрано место "+id+". Образцы не перемещены.";st.messageType="green"}else{st.message="Неизвестное место: "+id;st.messageType="red"}render();return}
var s=samples.find(function(x){return x.id.toUpperCase()===code.toUpperCase()||x.epc&&x.epc.toUpperCase()===code.toUpperCase()});if(s){st.found=s.id;render();return}
var matches=products.filter(function(p){return p.barcode===code||p.article.toUpperCase()===code.toUpperCase()});if(matches.length){st.matches=samples.filter(function(x){return !x.deleted&&matches.some(function(p){return p.id===x.p})});if(st.matches.length===1){st.found=st.matches[0].id;st.matches=[]}else if(!st.matches.length){st.message="Товар найден, но физические образцы пока не зарегистрированы.";st.messageType="amber"}render();return}
st.message="Код не найден: "+code;st.messageType="red";render()}
function observe(){var ins=st.inspection;if(!ins||ins.finished)return;var code=(document.getElementById("inspect-scan").value||"").trim();var s=samples.find(function(x){return !x.deleted&&(x.id.toUpperCase()===code.toUpperCase()||x.epc&&x.epc.toUpperCase()===code.toUpperCase())});if(!s){st.message="Неизвестный код. В реальной программе он попадёт в список неизвестных наблюдений.";st.messageType="amber"}else if(ins.seen.indexOf(s.id)>=0){st.message="Повторное чтение "+s.id+" не добавлено дважды.";st.messageType="amber"}else{ins.seen.push(s.id);st.message=(ins.expected.indexOf(s.id)>=0?"Найден на месте: ":"Чужой образец, без перемещения: ")+s.id;st.messageType=ins.expected.indexOf(s.id)>=0?"green":"amber"}render()}
function bind(){document.querySelectorAll("[data-nav]").forEach(function(el){el.addEventListener("click",function(){st.screen=el.getAttribute("data-nav");st.message="";st.scan="";render()})});
document.querySelectorAll("[data-open]").forEach(function(el){el.addEventListener("click",function(){st.found=el.getAttribute("data-open");st.matches=[];st.screen="search";st.message="";render()})});
var rackEl=document.getElementById("rack-select");if(rackEl)rackEl.addEventListener("change",function(){st.rack=this.value;st.message="Место работы изменено. Учётные места образцов не изменились.";st.messageType="green";render()});
var scan=document.getElementById("scan");if(scan)scan.addEventListener("keydown",function(e){if(e.key==="Enter")lookup(this.value)});
var inspect=document.getElementById("inspect-scan");if(inspect)inspect.addEventListener("keydown",function(e){if(e.key==="Enter")observe()});
var np=document.getElementById("new-product");if(np)np.addEventListener("change",function(){st.newProduct=this.value});
var nr=document.getElementById("new-rack");if(nr)nr.addEventListener("change",function(){st.newRack=this.value});
var ne=document.getElementById("new-epc");if(ne)ne.addEventListener("input",function(){st.newEpc=this.value});
document.querySelectorAll("[data-action]").forEach(function(el){el.addEventListener("click",function(){var a=el.getAttribute("data-action");
if(a==="scan")lookup(document.getElementById("scan").value);
else if(a==="example-wrong")lookup("S-000124");
else if(a==="example-many")lookup("4601234567890");
else if(a==="move"){var s=samples.find(function(x){return x.id===st.found});if(s&&!s.deleted&&s.loc!==st.rack){var old=s.loc;s.loc=st.rack;s.v++;history.unshift({kind:"Перемещение",id:s.id,desc:old+" → "+s.loc,time:"Только что"});st.message="Образец "+s.id+" перемещён в "+s.loc+" (только в макете).";st.messageType="green";render()}}
else if(a==="delete"){st.modal=st.found;render()}
else if(a==="cancel"){st.modal=null;render()}
else if(a==="confirm-delete"){var d=samples.find(function(x){return x.id===st.modal});if(d&&!d.deleted){d.deleted=true;d.v++;history.unshift({kind:"Удаление",id:d.id,desc:"Удалён из активного учёта, история сохранена",time:"Только что"});st.message="Образец удалён из активного учёта (только в макете).";st.messageType="red"}st.modal=null;render()}
else if(a==="create"){var epc=st.newEpc.trim();if(epc&&samples.some(function(x){return !x.deleted&&x.epc===epc})){st.message="Эта RFID-метка уже назначена активному образцу.";st.messageType="red";render();return}var id="S-"+String(st.next++).padStart(6,"0");samples.push({id:id,p:st.newProduct,loc:st.newRack,epc:epc,deleted:false,v:1});history.unshift({kind:"Создание",id:id,desc:product(st.newProduct).name+" · "+st.newRack,time:"Только что"});st.found=id;st.rack=st.newRack;st.screen="search";st.scan=id;st.message="Создан новый физический образец "+id+" (только в макете).";st.messageType="green";st.newEpc="";render()}
else if(a==="start-inspection"){st.inspection={rack:st.rack,expected:samples.filter(function(x){return !x.deleted&&x.loc===st.rack}).map(function(x){return x.id}),seen:[],finished:false};st.message="Снимок ожидаемых образцов зафиксирован.";st.messageType="green";render()}
else if(a==="observe")observe();
else if(a==="finish"){if(st.inspection){st.inspection.finished=true;st.message="Проверка завершена. Учётные места и состояния образцов не менялись.";st.messageType="green";render()}}
else if(a==="reset")location.reload();
})})}
render();
})();
</script></body></html>
